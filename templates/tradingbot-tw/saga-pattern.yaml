# 由 aswf.dev 模板起草器產生（存檔＝開 PR，經人類審核後合併）。
tenant: tradingbot-tw
name: saga-pattern
version: 1
source: 'tradingbot-tw/saga-pattern pilot (Orkes Conductor saga; orchestration defined outside the repo)'
phases: [P0, P1, P2, P3]
gates: [HG1, HG2, HG4, HG5, HG6, TRADINGBOT-TW-WORKFLOW]
gate_defs:
  - id: TRADINGBOT-TW-WORKFLOW
    signers: [tradingbot-tw]
    scope: phase
    evidence: pr-review
steps:
  - id: TB1
    phase: P0
    action: '需求分析與 Saga 編排盤點'
    kind: work-item
    task_type: agent-analyze
    per: system
  - id: TB2
    phase: P1
    action: '匯出 Conductor workflow 定義入庫'
    kind: human
  - id: TB3
    phase: P2
    action: '補測試（worker 與 workflow 契約、補償路徑）'
    kind: work-item
    task_type: agent-add-tests
    per: module
  - id: TB4
    phase: P3
    action: '文件更新'
    kind: work-item
    task_type: agent-write-docs
    per: module
