# EXAMPLE tenant template — 演示 ADR-025 的租戶自有流程；不是真實公司。
#
# 用途：讓 registry → Scoreboard 目錄 → 定義預覽的整條鏈有一個可看的範例，
# 同時作為「模板起草器輸出真的能通過 CI」的 round-trip 驗證。
# 真實租戶請依 templates/ONBOARDING.md 建立自己的目錄與 gate 前綴。
tenant: example
name: review-first
version: 1
source: 'EXAMPLE: docs/ADR/025-tenant-process-templates.md'
phases: [P0, P1, P2, P3]
gates: [HG1, HG2, HG4, HG5, HG6, EXAMPLE-SECURITY]
gate_defs:
  - id: EXAMPLE-SECURITY
    signers: [security-lead]
    scope: phase
    evidence: adr
steps:
  - {id: E1, phase: P0, action: 需求分析, kind: work-item, task_type: agent-analyze, per: system}
  - {id: E2, phase: P1, action: 安全審查, kind: human, gates: [EXAMPLE-SECURITY]}
  - {id: E3, phase: P2, action: 補測試, kind: work-item, task_type: agent-add-tests, per: module}
  - {id: E4, phase: P3, action: 文件更新, kind: work-item, task_type: agent-write-docs, per: module}
