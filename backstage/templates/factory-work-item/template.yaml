# factory-work-item Template（docs/ADR/009 局部解凍）
#
# 統一入口：填寫制式欄位（可先用 LLM 草稿助手產生）→ 建立格式合規的 GitHub Issue
# → 直接 dispatch factory-run.yml 觸發 agent（人類點擊送出＝核准，取代 label 閘門）。
#
# 欄位與 .github/ISSUE_TEMPLATE/factory-work-item.yml 對齊；body 格式與
# src/factory-draft/issue-body.ts（buildIssueBody）一致——對抗性測試
# factory-assets 釘住「### 標題」與 DoD label 逐字一致。
#
# ✅ 已驗證（Q09-1，2026-08-21 於 ../backstage-app v1.53.0 實跑，詳見 backstage/versions.md）：
# - github:issues:create 於 plugin-scaffolder-backend-module-github@0.9.11 存在，
#   輸入 repoUrl/title/body/labels/token，輸出 issueUrl + issueNumber；
# - FactoryWorkItemDraftField 以 FormFieldBlueprint.make 註冊（new frontend system）
#   編譯成功（bundle 含該 extension）；
# - catalog location 的 ref 不得含斜線（git-url-parse 拆錯）——dev 用 commit SHA，
#   PR #145 合併後改回 main。
# ⏳ 剩餘待瀏覽器實測（需 GitHub OAuth 登入）：
# - 表達式字串拼接（'[factory] ' + ...）與 block scalar 內多行 ${{ }} 渲染；
# - rjsf formData 跨欄位讀取（讀 parameters.taskType 供草稿上下文）；
# - 完整表單流程：釐清 → 一次生成 → 建 Issue → dispatch factory-run。
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: factory-work-item
  title: 開立 Factory 工作項
  description: 填寫制式欄位（可先用 LLM 產生草稿）→ 建立格式合規的 GitHub Issue → 觸發 factory agent
spec:
  owner: user:philipz
  type: service
  parameters:
    - title: 工作項資訊
      required: [oneLiner, taskType, requirement, targetRepo]
      properties:
        oneLiner:
          title: 一句話需求（Issue 標題）
          type: string
          description: 將自動加上 `[factory] ` 前綴成為 Issue 標題
        taskType:
          title: 任務類型
          type: string
          default: agent-add-tests
          enum:
            - agent-add-tests
            - agent-fix-bug
            - agent-update-deps
            - agent-write-docs
            - agent-write-spec
            - agent-analyze
            - agent-propose-skill
          description: 決定 task-template 與 skill 分支（docs/09 §3 2.1）；預設 agent-add-tests（與 workflow input / issue-check fallback 一致）
        requirement:
          title: 需求描述（PRD）
          type: string
          ui:field: FactoryWorkItemDraftField
          description: 做什麼、為什麼、範圍（可先按「✨ 一次生成」讓 LLM 產生草稿再逐欄審改）
        # ⚠️ 2026-09 移除 dodTest/dodRisk/dodRun 三個 boolean 欄位（假選擇）。
        #
        # 原因（factory-scoreboard#3 實證）：這三個參數從未被任何 step 消費——
        # 下方 body 的三行 DoD 是**寫死的 `- [x]`**，勾或不勾都輸出相同文字。
        # 且 JSON Schema 的 `required` 對 boolean 無效（rjsf 未勾送 false，
        # key 仍存在），故它們既擋不住任何東西，也不影響輸出：純 UI 裝飾，
        # 反而讓人誤以為已做出選擇。
        #
        # 「三項必勾」的語意不變、也未被放寬：DoD 是對 agent 的固定作業承諾，
        # 對所有工作項恆成立，故直接以固定文字寫入 body（與 GitHub 原生入口
        # .github/ISSUE_TEMPLATE/factory-work-item.yml 的 required:true 一致），
        # factory-issue-check 的 hasCheckedAcceptance「3/3 全勾」契約完全不動。
        #
        # 「是否觸碰高風險路徑」改由 factory-issue-check 依 PRD 宣告路徑比對
        # risk-paths.yml 客觀判定（advisory 提示），不再依賴人類自我申報——
        # #3 的填單者其實在 PRD 內文誠實寫明會觸發 H5，只是沒有機器讀它。
        targetRepo:
          title: 目標 repo（agent 工作對象）
          type: string
          ui:field: RepoUrlPicker
          # 預設帶入 philipz，但 Owner 欄位保持可編輯（不設 allowedOwners）——
          # allowedOwners 會把 Owner render 成受限的下拉選單，單一值時等同唯讀，
          # 導致無法驗證非 philipz 的 repo（例如 agent-playground）。
          default: github.com?owner=philipz
          ui:options:
            # 只允許 github.com（單 host 時自動帶入，避免 Host 下拉互動問題）
            allowedHosts: [github.com]
        baseBranch:
          title: 目標 repo 的 factory trunk 分支
          type: string
          default: software-factory
          description: 統一（ADR-013）：所有 repo 的 factory trunk 皆為 software-factory 分支，main 絕不觸碰（Q-P2-1）；含機制 repo 自身
  steps:
    - id: create-issue
      name: 建立 GitHub Issue
      action: github:issues:create
      input:
        repoUrl: ${{ parameters.targetRepo }}
        title: ${{ '[factory] ' + parameters.oneLiner }}
        body: |
          ### 任務類型

          ${{ parameters.taskType }}

          ### 需求描述（PRD）

          ${{ parameters.requirement }}

          ### 驗收標準（DoD）

          - [x] 有可驗證的測試/驗證方式（測試紅→綠或明確驗證命令）
          - [x] 不觸碰高風險路徑（H1–H3 等硬規則，見 risk-paths.yml）
          - [x] 跑測試確認綠燈（不跑需外部服務的 E2E）

          ### 目標 repo（預設本 repo）

          ${{ parameters.targetRepo | replace('github.com?owner=', '') | replace('&repo=', '/') }}
        labels:
          - meta/observation
    - id: dispatch
      name: 觸發工廠工作流
      action: github:actions:dispatch
      input:
        # dispatch 一律到機制 repo（factory-run.yml 所在）；目標 repo 走 workflowInputs.repo
        repoUrl: github.com?owner=philipz&repo=software_factory
        workflowId: factory-run.yml
        branchOrTagName: main
        workflowInputs:
          # issueNumber 輸出是 number；workflowInputs 值必須全為字串
          #（2026-08-21 實測 InputError）——nunjucks 內建 string filter 轉型
          issue_number: ${{ steps['create-issue'].output.issueNumber | string }}
          repo: ${{ parameters.targetRepo | replace('github.com?owner=', '') | replace('&repo=', '/') }}
          base_branch: ${{ parameters.baseBranch }}
          task_type: ${{ parameters.taskType }}
  output:
    # 歷史查閱分頁（ADR-017）以此結構化欄位取得 Issue 連結；在此之前建立的
    # 任務只能從 log 字串解析，故新任務一律走這條。
    links:
      - title: 已建立的 Issue
        url: ${{ steps['create-issue'].output.issueUrl }}
    text:
      - title: 建立與觸發完成
        content: |
          已建立 Issue（title: `[factory] ${{ parameters.oneLiner }}`）並觸發 `factory-run.yml`（task_type: ${{ parameters.taskType }}）。
          執行狀態請見 GitHub Actions 頁面：
          https://github.com/philipz/software_factory/actions
