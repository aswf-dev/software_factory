# 對既有 Issue 派工（Phase 1 的 agent-add-tests Template，2026-09-27 改為通用）
#
# 任務類型一律以 Issue 宣告為準（task_type: auto），表單不提供類型欄位。
# 原本寫死 `task_type: agent-add-tests`：factory-run 以 dispatch 指定值優先，
# 對非 add-tests 的 Issue 派工會靜默改跑補測試（與 #287 同一類漂移）——
# 例如 agent-write-spec 的模型階段會跳過階段判定、白名單與集中驗證。
# 目錄與 metadata.name 維持 agent-add-tests：backstage-app 的 catalog location
# 以此路徑註冊，改名會讓 Backstage 找不到模板。
#
# 已驗證（Q03-2，2026-08-17）：
# - `github:actions:dispatch` 為 @backstage/plugin-scaffolder-backend-module-github
#   的內建 action，inputs：token/repoUrl/workflowId/workflowInputs/branchOrTagName；
#   該 action **沒有輸出 schema**，因此拿不到 workflowRunUrl —— 輸出改為指引使用者
#   前往 Actions 頁面查看（docs/03 §3.2 的 fallback 精神：不依賴未驗證的輸出）。
# - 使用方式：使用者**先建立 Issue（含明確驗收條件，SR4 要求）**，再由此 Template
#   填入 Issue 編號觸發 factory-run.yml；這比「Template 建 Issue 再 dispatch」更簡單
#   且不依賴 issue 編號在 step 間的傳遞。
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: agent-add-tests
  title: 對既有 Issue 派工
  description: 對已建立的工作項 Issue 觸發工廠 agent，任務類型依 Issue 宣告（例如 agent-write-spec 核准後的模型階段）
spec:
  owner: user:philipz
  type: service
  parameters:
    - title: 工作項資訊
      required: [targetRepo, issueNumber]
      properties:
        targetRepo:
          title: 目標 repo（agent 工作對象）
          type: string
          ui:field: RepoUrlPicker
          # 預設帶入 philipz，但 Owner 欄位保持可編輯（不設 allowedOwners）——
          # allowedOwners 會把 Owner render 成受限的下拉選單，單一值時等同唯讀，
          # 導致無法對非 philipz 的 repo（例如 agent-playground）派工。
          default: github.com?owner=philipz
          ui:options:
            # 只允許 github.com（單 host 時自動帶入，避免 Host 下拉互動問題）
            allowedHosts: [github.com]
            # 取得登入者本人的 GitHub OAuth token（ScmAuth 預設 scope 含 repo），
            # 供下方 dispatch 以使用者身分觸發機制 repo 的 factory-run。
            # 不用 integrations.github.token（philipz 的 fine-grained PAT）：它綁
            # philipz 這個資源擁有者，對 aswf-dev 組織 dispatch 一律 403；且
            # fine-grained PAT 最長 366 天，OAuth App token 不過期。
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
        issueNumber:
          title: Issue 編號
          type: string
          description: 該 Issue 必須已具備「任務類型」與明確的驗收條件（SR4：缺驗收條件 agent 會停手）；workflow_dispatch 的 input 需字串
        baseBranch:
          title: 目標 repo 的 factory trunk 分支
          type: string
          default: software-factory
          description: 統一（ADR-013）：所有 repo 的 factory trunk 皆為 software-factory 分支，main 絕不觸碰（Q-P2-1）；含機制 repo 自身
  steps:
    - id: dispatch
      name: 觸發工廠工作流
      action: github:actions:dispatch
      input:
        # dispatch 一律到機制 repo（factory-run.yml 所在）；目標 repo 走 workflowInputs.repo。
        # repoUrl 須為 scaffold 格式（host?owner=..&repo=..），非完整 URL。
        repoUrl: github.com?owner=aswf-dev&repo=software_factory
        # 以登入者身分 dispatch（RepoUrlPicker 的 requestUserCredentials 取得）。
        # 前提：使用者對機制 repo 須有 write 權限，否則 GitHub 回 403/404。
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        workflowId: factory-run.yml
        branchOrTagName: main
        workflowInputs:
          issue_number: ${{ parameters.issueNumber }}
          repo: ${{ parameters.targetRepo | replace('github.com?owner=', '') | replace('&repo=', '/') }}
          base_branch: ${{ parameters.baseBranch }}
          # 依 Issue 宣告（見檔頭）；Issue 無法解析類型時 factory-run 會 fail-loud
          task_type: auto
  output:
    text:
      - title: 觸發完成
        content: |
          已觸發 `factory-run.yml`（任務類型依 Issue 宣告；Issue #${{ parameters.issueNumber }}，repo: ${{ parameters.targetRepo | replace('github.com?owner=', '') | replace('&repo=', '/') }}）。
          執行狀態請見 GitHub Actions 頁面：
          https://github.com/aswf-dev/software_factory/actions
