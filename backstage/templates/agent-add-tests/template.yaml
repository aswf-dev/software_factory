# agent-add-tests Template（Phase 1）
#
# 已驗證（Q03-2，2026-08-17）：
# - `github:actions:dispatch` 為 @backstage/plugin-scaffolder-backend-module-github
#   的內建 action，inputs：token/repoUrl/workflowId/workflowInputs/branchOrTagName；
#   該 action **沒有輸出 schema**，因此拿不到 workflowRunUrl —— 輸出改為指引使用者
#   前往 Actions 頁面查看（docs/03 §3.2 的 fallback 精神：不依賴未驗證的輸出）。
# - 使用方式：使用者**先建立 Issue（含明確驗收條件，SR4 要求）**，再由此 Template
#   填入 Issue 編號觸發 factory-run.yml；這比「Template 建 Issue 再 dispatch」更簡單
#   且不依賴 issue 編號在 step 間的傳遞。
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: agent-add-tests
  title: 請 agent 補測試
  description: 將「補測試」工作項交由工廠 agent 處理（低風險類別，docs/00 §6 明列）
spec:
  owner: user:philipz
  type: service
  parameters:
    - title: 工作項資訊
      required: [targetRepo, issueNumber]
      properties:
        targetRepo:
          title: 目標 repo（agent 工作對象）
          type: string
          ui:field: RepoUrlPicker
          # 預設帶入 philipz，但 Owner 欄位保持可編輯（不設 allowedOwners）——
          # allowedOwners 會把 Owner render 成受限的下拉選單，單一值時等同唯讀，
          # 導致無法對非 philipz 的 repo（例如 agent-playground）派工。
          default: github.com?owner=philipz
          ui:options:
            # 只允許 github.com（單 host 時自動帶入，避免 Host 下拉互動問題）
            allowedHosts: [github.com]
        issueNumber:
          title: Issue 編號
          type: string
          description: 該 Issue 必須已具備明確的驗收條件（SR4：缺驗收條件 agent 會停手）；workflow_dispatch 的 input 需字串
        baseBranch:
          title: 目標 repo 的 factory trunk 分支
          type: string
          default: software-factory
          description: 統一（ADR-013）：所有 repo 的 factory trunk 皆為 software-factory 分支，main 絕不觸碰（Q-P2-1）；含機制 repo 自身
  steps:
    - id: dispatch
      name: 觸發工廠工作流
      action: github:actions:dispatch
      input:
        # dispatch 一律到機制 repo（factory-run.yml 所在）；目標 repo 走 workflowInputs.repo。
        # repoUrl 須為 scaffold 格式（host?owner=..&repo=..），非完整 URL。
        repoUrl: github.com?owner=philipz&repo=software_factory
        workflowId: factory-run.yml
        branchOrTagName: main
        workflowInputs:
          issue_number: ${{ parameters.issueNumber }}
          repo: ${{ parameters.targetRepo | replace('github.com?owner=', '') | replace('&repo=', '/') }}
          base_branch: ${{ parameters.baseBranch }}
          task_type: agent-add-tests
  output:
    text:
      - title: 觸發完成
        content: |
          已觸發 `factory-run.yml`（Issue #${{ parameters.issueNumber }}，repo: ${{ parameters.targetRepo | replace('github.com?owner=', '') | replace('&repo=', '/') }}）。
          執行狀態請見 GitHub Actions 頁面：
          https://github.com/philipz/software_factory/actions
