# Backstage 團隊白名單（Phase A1-2，signIn 白名單）。
#
# 認證解析（app-config.yaml auth.providers.github.signIn.resolvers）用
# `emailMatchingUserEntityAnnotation`——GitHub 登入後比對 User entity 的
# `github.com/user-login` annotation；不在清單中即拒絕登入。
#
# 新增成員：複製下列 entity 並填 GitHub 登入名（與 email）。
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: philipz
  annotations:
    github.com/user-login: philipz
spec:
  profile:
    displayName: Philip Zheng
    email: philipzheng@gmail.com
  memberOf: [factory-team]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: factory-team
spec:
  type: team
  children: []
  members: [philipz]
