# DSH settings for CI (docs/04-agent-execution-dsh.md §4).
#
# Copied to $DSH_HOME/settings.yaml by the probe workflow.
#
# Why this file must exist: with a clean DSH_HOME, DSH routes to its default
# provider (deepseek) and fails with MISSING_CREDENTIAL. A developer's local
# runs succeed only because ~/.dsh/settings.yaml already selects a provider,
# so the difference stays invisible until CI runs for the first time.
#
# Credential doctrine (docs/05 §3.1): this file carries a REFERENCE
# (`apiKeyEnv`) and never the key itself, so it is safe to commit. The value
# lives in GitHub Secrets and reaches the process as an environment variable.
llm-pi-ai:
  providers:
    anthropic:
      apiKeyEnv: ANTHROPIC_API_KEY

agent-default-model:
  provider: anthropic
  model: claude-opus-5
