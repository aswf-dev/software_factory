# DSH 多 provider 設定（Q04-8：可切換 provider 避開個別 rate limit）。
#
# factory-run.yml 每次嘗試以 factory-dsh-patch 把本檔的 `llm-pi-ai` 區段連同該次的
# agent-default-model 轉成 Cordis patch，再以 `dsh --patch` 帶入（DSH 0.1.7 已移除
# settings.yaml，見 src/model-tier/dsh-patch.ts）。credential 只放 env 參照（apiKeyEnv），金鑰永不入檔
# （docs/05 §3.1）。未設定對應 secret 的 provider 若被選用，會以
# MISSING_CREDENTIAL 明確失敗而非靜默使用其他金鑰。
#
# - anthropic：pi-ai 內建目錄路由（現役，成本最高）
# - deepseek：**手動宣告**（2026-09-11 起）。原為 pi-ai 內建目錄路由，但 V4.1 Flash
#   的模型 id `deepseek-flash` 不在 pi-ai 0.85.1（現行最新）的內建 catalog 內
#   （catalog 只有已退役的 deepseek-v4-flash / deepseek-v4-flash-vision-exp 與
#   deepseek-v4-pro），實測 DSH 會以 UNKNOWN_MODEL 失敗。故改為明列 models。
#   ⚠️ pi-ai 語意：**models 清單會「取代」該 route 的內建 catalog**，因此本檔需
#   自行維護 contextWindow/maxTokens/reasoningEfforts/compat（compat 數值取自
#   pi-ai catalog 的 deepseek-v4-flash 條目，ctx/輸出上限取自官方定價頁）。
#   待 pi-ai catalog 收錄 deepseek-flash 後，可刪除 models 區塊改回內建路由。
# - qwen：手動宣告的 OpenAI-compatible 路由（QwenCloud 國際端點 dashscope-intl；
#   2026-08-28 修正：原誤用中國端點 dashscope.aliyuncs.com，導致 QwenCloud
#   Pay-As-You-Go key 回 401 invalid_api_key——QwenCloud 文件
#   docs.qwencloud.com/developer-guides/getting-started/first-api-call 指定
#   國際端點 https://dashscope-intl.aliyuncs.com/compatible-mode/v1）
llm-pi-ai:
  providers:
    anthropic:
      apiKeyEnv: ANTHROPIC_API_KEY
    deepseek:
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      models:
        # DeepSeek-V4.1-Flash（2026-09-10 發布）。官方：「Use `deepseek-flash` as
        # the model name.」——舊名 deepseek-v4-flash 已退役（僅保留相容轉送）。
        - id: deepseek-flash
          name: DeepSeek V4.1 Flash
          contextWindow: 1000000
          maxTokens: 384000
          input: [text, image] # V4.1 Flash 原生多模態視覺理解
          reasoningEfforts: { low: low, high: high, max: max }
          compat:
            supportsStore: false
            supportsDeveloperRole: false
            maxTokensField: max_tokens
            requiresReasoningContentOnAssistantMessages: true
            thinkingFormat: deepseek
    qwen:
      displayName: Qwen (QwenCloud / DashScope-intl)
      apiKeyEnv: QWEN_API_KEY
      api: openai-completions
      baseURL: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      models:
        - id: qwen3.8-flash
          name: Qwen3.8 Flash
          contextWindow: 1048576
        - id: qwen3.7-flash
          name: Qwen3.7 Flash
          contextWindow: 131072
