# DSH 模型路由 patch，給 dsh-sandbox-probe.yml 用（docs/04-agent-execution-dsh.md §4）。
#
# 以 `dsh --patch config/dsh/probe.patch.yml` 帶入。DSH 0.1.7 已移除
# $DSH_HOME/settings.yaml（只在啟動後非同步匯入一次，headless 來不及生效），
# 設定改以 Cordis patch 依 entry id 覆寫；覆寫會整段取代該 entry 的 config。
#
# 為什麼一定要有：乾淨的 DSH_HOME 會落到內建預設（deepseek-official），
# 探針環境沒有 DeepSeek 金鑰，執行期逃逸測試會在 agent 啟動前就失敗。
#
# claude-opus-5-5 不在 DSH 0.1.7-rc.1 綁定的 pi-ai 0.85.1 目錄內（0.87.1 起才收錄），
# 所以手動宣告；欄位取自 pi-ai 0.87.1 目錄的 claude-opus-5-5 條目。
# 注意：`models` 會整個取代 anthropic route 的內建目錄——這裡只列探針用得到的模型。
# 待 DSH 綁定的 pi-ai 收錄 claude-opus-5-5 後，可刪除 models 區塊改回內建目錄。
#
# 憑證原則（docs/05 §3.1）：只放 env 參照（apiKeyEnv），金鑰本身在 GitHub Secrets。
- id: llm-pi-ai
  config:
    providers:
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
        models:
          - id: claude-opus-5-5
            name: Claude Opus 5.5
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts: { low: low, medium: medium, high: high, xhigh: xhigh, max: max }
            # supportsMidConvoEffort 由 pi-ai 目錄依供應商設定，手動宣告時不允許（INVALID_CONFIG）
            compat:
              forceAdaptiveThinking: true
              supportsTemperature: false
              supportsStrictTools: true

- id: agent-default-model
  config:
    provider: anthropic
    model: claude-opus-5-5
