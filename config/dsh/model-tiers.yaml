# DSH 模型分級路由政策（docs/ADR/011、docs/04 §7）。
#
# 依 Issue 複雜度選擇模型 tier（低/中 → qwen3.8-flash（預設）、高 → deepseek-v4.1-flash、
# 最高 critical → claude-opus-5）。每個 tier 的 primary 為首選，fallback
# 僅在 provider 層失敗（429/credential/UNKNOWN_MODEL）時依序嘗試；任務層失敗
# 不重試（docs/02 §6）。
#
# 2026-08-27 用戶裁決：預設模型由 deepseek-v4-flash 改為 qwen3.8-flash（QwenCloud），
# 原預設 deepseek-v4-flash 退居 low/medium fallback（跨 provider failover，Q04-8）。
# 2026-08-28 用戶裁決：claude-fable-5 需額外 credit（帳號方案未包含，實測 run
# #33175623064 無法使用）——**移除 fable-5**，critical 預設改為同代旗艦 claude-opus-5。
# 2026-09-11 用戶裁決：DeepSeek 官方公告 V4.1 Flash 於 2026-09-10 12:00（北京時間）
# 正式發布，並宣告「V4.1 Flash 在性能、費用、速度、總用時等各項指標上全面超越 V4 Pro」，
# 且在 V4.1 Pro 上線前將 **V4 Pro 的請求全部路由至 V4.1 Flash 並按 V4.1 Flash 單價計費**。
# 因此 deepseek-v4-flash 與 deepseek-v4-pro 一律改為 **deepseek-v4.1-flash**。
#
# 由 factory-model CLI 讀取（--tiers），並與 config/dsh/settings.providers.yaml
# 的 provider 宣告互相驗證（對抗性測試釘住：本檔 provider 必須是已宣告 route）。
# 模型 id 來自 pi-ai catalog（2026-08 查證）；定價（USD/MTok input/output）：
#   qwen3.8-flash $0.15/0.47、deepseek-v4.1-flash $0.282/1.127（高峰時段，見 pricing.yaml）、
#   claude-sonnet-5 $2/10、claude-opus-5 $5/25。
tiers:
  low:
    primary:
      provider: qwen
      model: qwen3.8-flash
    fallback:
      - provider: deepseek
        model: deepseek-v4.1-flash
  medium:
    primary:
      provider: qwen
      model: qwen3.8-flash
    fallback:
      - provider: deepseek
        model: deepseek-v4.1-flash
  high:
    # 2026-09-11：原 deepseek-v4-pro。官方將 V4 Pro 請求全部路由至 V4.1 Flash，
    # 續留舊 id 只是讓 provider 端替換，明寫新 id 才與實際計費模型一致。
    primary:
      provider: deepseek
      model: deepseek-v4.1-flash
    fallback:
      - provider: anthropic
        model: claude-sonnet-5
      - provider: qwen
        model: qwen3.8-flash
  critical:
    # 最高 tier 預設：claude-opus-5（2026-08-28 用戶裁決：fable-5 需額外 credit 已移除，
    # 不再有「只有最高才用 fable」——最高 tier 直接以同代旗艦 opus-5 為 primary）。
    primary:
      provider: anthropic
      model: claude-opus-5
    fallback:
      - provider: deepseek
        model: deepseek-v4.1-flash
      - provider: qwen
        model: qwen3.8-flash
