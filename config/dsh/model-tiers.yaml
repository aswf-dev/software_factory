# DSH 模型分級路由政策（docs/ADR/011、docs/04 §7）。
#
# 依 Issue 複雜度選擇模型 tier（低/中 → qwen3.8-flash（預設）、高 → deepseek-v4-pro、
# 最高 critical → claude-opus-5）。每個 tier 的 primary 為首選，fallback
# 僅在 provider 層失敗（429/credential/UNKNOWN_MODEL）時依序嘗試；任務層失敗
# 不重試（docs/02 §6）。
#
# 2026-08-27 用戶裁決：預設模型由 deepseek-v4-flash 改為 qwen3.8-flash（QwenCloud），
# 原預設 deepseek-v4-flash 退居 low/medium fallback（跨 provider failover，Q04-8）。
# 2026-08-28 用戶裁決：claude-fable-5 需額外 credit（帳號方案未包含，實測 run
# #33175623064 無法使用）——**移除 fable-5**，critical 預設改為同代旗艦 claude-opus-5。
#
# 由 factory-model CLI 讀取（--tiers），並與 config/dsh/settings.providers.yaml
# 的 provider 宣告互相驗證（對抗性測試釘住：本檔 provider 必須是已宣告 route）。
# 模型 id 來自 pi-ai catalog（2026-08 查證）；定價（USD/MTok input/output）：
#   qwen3.8-flash $0.15/0.47、deepseek-v4-flash $0.14/0.28、deepseek-v4-pro $0.435/0.87、
#   claude-sonnet-5 $2/10、claude-opus-5 $5/25。
tiers:
  low:
    primary:
      provider: qwen
      model: qwen3.8-flash
    fallback:
      - provider: deepseek
        model: deepseek-v4-flash
  medium:
    primary:
      provider: qwen
      model: qwen3.8-flash
    fallback:
      - provider: deepseek
        model: deepseek-v4-flash
  high:
    primary:
      provider: deepseek
      model: deepseek-v4-pro
    fallback:
      - provider: anthropic
        model: claude-sonnet-5
      - provider: qwen
        model: qwen3.8-flash
  critical:
    # 最高 tier 預設：claude-opus-5（2026-08-28 用戶裁決：fable-5 需額外 credit 已移除，
    # 不再有「只有最高才用 fable」——最高 tier 直接以同代旗艦 opus-5 為 primary）。
    primary:
      provider: anthropic
      model: claude-opus-5
    fallback:
      - provider: deepseek
        model: deepseek-v4-pro
      - provider: qwen
        model: qwen3.8-flash
