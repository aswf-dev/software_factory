# DSH 模型分級路由政策（docs/ADR/011、docs/04 §7）。
#
# 依 Issue 複雜度選擇模型 tier（低/中 → qwen3.8-flash（預設）、高 → deepseek-flash、
# 最高 critical → claude-opus-5）。每個 tier 的 primary 為首選，fallback
# 僅在 provider 層失敗（429/credential/UNKNOWN_MODEL）時依序嘗試；任務層失敗
# 不重試（docs/02 §6）。
#
# 2026-08-27 用戶裁決：預設模型由 deepseek-v4-flash 改為 qwen3.8-flash（QwenCloud），
# 原預設 deepseek-v4-flash 退居 low/medium fallback（跨 provider failover，Q04-8）。
# 2026-08-28 用戶裁決：claude-fable-5 需額外 credit（帳號方案未包含，實測 run
# #33175623064 無法使用）——**移除 fable-5**，critical 預設改為同代旗艦 claude-opus-5。
# 2026-09-11 用戶裁決：DeepSeek 官方 2026-09-10 發布 DeepSeek-V4.1-Flash，宣告
# 「V4.1 Flash 在性能、費用、速度、總用時等各項指標上全面超越 V4 Pro」。官方 API 文件：
#   - 新模型 id 為 **`deepseek-flash`**（官方原文：Use `deepseek-flash` as the model name）；
#   - 舊名 `deepseek-v4-flash` / `deepseek-v4-flash-vision-exp` **已退役**，僅保留相容轉送；
#   - 自 2026-09-14 12:00（北京時間）起至 V4.1 Pro 發布前，`deepseek-v4-pro` 的請求
#     全部路由至 V4.1 Flash 並按 V4.1 Flash 單價計費。
# 因此 deepseek-v4-flash 與 deepseek-v4-pro 一律改為 **deepseek-flash**。
# ⚠️ 實測：`deepseek-v4.1-flash` 是**不存在的 id**（API 回 HTTP 400）；且 `deepseek-flash`
# 不在 pi-ai 0.85.1 內建 catalog，需在 settings.providers.yaml 明列（見該檔說明）。
#
# 由 factory-model CLI 讀取（--tiers），並與 config/dsh/settings.providers.yaml
# 的 provider 宣告互相驗證（對抗性測試釘住：本檔 provider 必須是已宣告 route，
# 且每個 deepseek/qwen 模型 id 必須在該檔的 models 清單內）。
# 定價（USD/MTok input/output，官方公布價高峰時段，見 pricing.yaml）：
#   qwen3.8-flash $0.15/0.47、deepseek-flash $0.30/1.20、
#   claude-sonnet-5-5 $2/10、claude-opus-5 $5/25。
tiers:
  low:
    primary:
      provider: qwen
      model: qwen3.8-flash
    fallback:
      - provider: deepseek
        model: deepseek-flash
  medium:
    primary:
      provider: qwen
      model: qwen3.8-flash
    fallback:
      - provider: deepseek
        model: deepseek-flash
  high:
    # 2026-09-11：原 deepseek-v4-pro。官方自 2026-09-14 12:00（北京時間）起將
    # V4 Pro 請求全部路由至 V4.1 Flash，續留舊 id 只是讓 provider 端替換，
    # 明寫新 id 才與實際計費模型一致。
    primary:
      provider: deepseek
      model: deepseek-flash
    fallback:
      - provider: anthropic
        model: claude-sonnet-5-5
      - provider: qwen
        model: qwen3.8-flash
  critical:
    # 最高 tier 預設：claude-opus-5（2026-08-28 用戶裁決：fable-5 需額外 credit 已移除，
    # 不再有「只有最高才用 fable」——最高 tier 直接以同代旗艦 opus-5 為 primary）。
    #
    # reasoningEffort: max（2026-09-11 用戶裁決）——**這個欄位決定 critical tier
    # 是否有存在意義**。Artificial Analysis Intelligence Index v4.3 第三方實測：
    #   Opus 5（Max Effort）  = 51 分
    #   Opus 5（Low Effort）  = 40 分 ← 與 deepseek-flash 打平，但每任務成本貴約 21 倍
    #   deepseek-flash（Max） = 40 分
    # 先前未設此欄位 → 走 provider 預設 effort（值未知），等於可能付旗艦價只換到
    # 平手品質。明設 max 讓「最高 tier」名實相符。
    # 注意：opus-5 只接受 off / xhigh / max（pi-ai catalog 的 thinkingLevelMap），
    # 不接受 low / medium / high——填錯會以 UNSUPPORTED_REASONING_EFFORT 失敗。
    #
    # 2026-09-27 用戶裁決：primary 改為 claude-opus-5-5，opus-5 退為第一順位 fallback。
    # opus-5-5 不在 DSH 0.1.7-rc.1 綁定的 pi-ai 0.85.1 目錄（0.87.1 起收錄）：升級前
    # 會在 ~2 秒內以 UNKNOWN_MODEL 失敗（未發出網路請求），命中 provider 層 fallback
    # 而改用 opus-5——行為與改動前相同；DSH 升級到收錄 opus-5-5 的 pi-ai 後自動生效，
    # 不需再改設定。刻意不在 settings.providers.yaml 手動宣告：models 清單會整個取代
    # anthropic route 的內建目錄，連 opus-5／sonnet-5 都得自行維護參數。
    # opus-5-5 支援 low～max 全部 effort；維持 max 與 opus-5 同一品質基準。
    primary:
      provider: anthropic
      model: claude-opus-5-5
      reasoningEffort: xhigh
    fallback:
      - provider: anthropic
        model: claude-opus-5
        reasoningEffort: xhigh
      - provider: deepseek
        model: deepseek-flash
      - provider: qwen
        model: qwen3.8-flash
