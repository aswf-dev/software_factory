# 真實租戶系統（第一個試點）：agent-playground/restate-cloudflare-workers-poc。
#
# 系統採用租戶模板 `agent-playground/review-first@1`；scale 是人類宣告（catalog-info
# 的三軸 tactical/low/low），不由模板推導。模組清單在目標 repo 的 factory/process.yaml。
system: agent-playground/restate-cloudflare-workers-poc
scale: M
scale_evidence: 'target repo catalog-info.yaml（tactical/low/low；on-loop 試點）'
template: agent-playground/review-first
template_version: 1
phases: [P0, P1, P2, P3]
gates: [HG1, HG2, HG4, HG5, HG6, AGENT-PLAYGROUND-SECURITY]

# 租戶模板沒有修復步驟；P4 的缺陷修復以 extra_step 加到這個系統（可加不可重排）。
# conditional：只有測試／分析揭露缺陷時才開（人判斷），待開清單不自動建議——
# 否則每個做完 AP4 的模組都會被建議「修缺陷」，即使沒有已知缺陷。
extra_steps:
  - id: AP5
    phase: P3
    action: 修復缺陷（先補失敗測試再修）
    kind: work-item
    task_type: agent-fix-bug
    per: module
    conditional: true
