# 小型專案的流程模板（docs/29 §9.1）。
#
# 這是**方法論的機器可讀版**：步驟與順序必須與 docs/29 §9.1 的表格一一對應；
# 改這裡就等於改流程，一律走 PR。
#
# `process.yaml` 不重述這些步驟，只宣告 `template: S` 與 `extra_steps`——
# 因此「刪掉必要步驟」或「調換順序」在結構上不可能（ADR-023）。
template: S
version: 1
source: docs/29-brownfield-adoption-playbook.md §9.1
phases: [P0, P1, P2, P3, P4]
gates: [HG1, HG2, HG3, HG4, HG5, HG6]

steps:
  - id: S0
    phase: P0
    action: 開導入追蹤 Issue
    kind: human
  - id: S1
    phase: P0
    action: 安裝 App、建立 software-factory 分支
    kind: human
  - id: S2
    phase: P0
    action: 納管提案
    kind: work-item
    task_type: agent-onboard
    per: repo
  - id: S3
    phase: P0
    action: 裁定三軸、搬檔、雙向探測
    kind: human
    gates: [HG1]
  - id: S4
    phase: P1
    action: 規模與就緒度量測（A0）
    kind: work-item
    task_type: agent-analyze
    per: system
    gates: [HG2]
  - id: S5
    phase: P1
    action: 架構、測試、相依、風險盤點（A1–A4）
    kind: work-item
    task_type: agent-analyze
    per: system
    gates: [HG6]
  - id: S6
    phase: P2
    action: README＋架構總覽
    kind: work-item
    task_type: agent-write-docs
    per: system
    gates: [HG3]
  - id: S7
    phase: P2
    action: 撰寫核心模組業務規則
    kind: human
    gates: [HG4, HG6]
  - id: S8
    phase: P3
    action: 依 A2 清單補測試（每模組／檔案 1 張）
    kind: work-item
    task_type: agent-add-tests
    per: module
    gates: [HG3]
  - id: S9
    phase: P3
    action: 修復揭露的缺陷（每個缺陷 1 張）
    kind: work-item
    task_type: agent-fix-bug
    per: defect
    conditional: true
    gates: [HG3]
  - id: S10
    phase: P3
    action: 驗證閘門（每核心模組擇一）
    kind: work-item
    per: module
    alternatives:
      - kind: work-item
        action: Quint 可執行規格
        task_type: agent-write-spec
      - kind: work-item
        action: Hegel 性質測試稽核
        task_type: agent-pbt-audit
      - kind: human
        action: 豁免單（HG5 簽核）
    gates: [HG5, HG6]
  - id: S11
    phase: P4
    action: 維護（依需要）
    kind: work-item
    required: false
    alternatives:
      - kind: work-item
        action: 升級相依
        task_type: agent-update-deps
      - kind: work-item
        action: 修復缺陷
        task_type: agent-fix-bug
      - kind: work-item
        action: 提出技能草案
        task_type: agent-propose-skill
    gates: [HG0, HG3]
