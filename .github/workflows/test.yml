# Factory self-test (docs/11-test-strategy.md §7).
#
# This workflow IS the "non-AI automation prerequisite" that Gartner G00843405
# requires before introducing AI (docs/00-source-summary.md §3 Phase 1 Step 1).
# Until it is reliably green, the factory has no basis to trust a CI signal, and
# docs/09-roadmap.md phase 0 must not be exited.
name: Test

on:
  push:
    # software-factory 是 factory trunk（統一規則 ADR-013，stacked PR 的 base）——
    # push 也需獨立綠燈（docs/07 §2.2「每層獨立綠燈」；試點 #3 教訓同 POC ci.yml）
    branches: [main, software-factory]
  pull_request:
  # Squash merges create a NEW commit on main whose content differs from the
  # verified PR head, and that commit can end up with no check-runs at all.
  # Manual dispatch lets us attach a verification record to main after a merge
  # (docs/12 §2.2). Without it, main carries code CI never signed off on.
  workflow_dispatch:

# Least privilege: this job only reads code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 依賴漏洞 gate（第一層 security，2026-08-20）：npm audit 直接查 npm 已知
      # CVE；high 以上即紅燈（配合 Dependabot alerts 自動開修復 PR）。
      - name: npm audit (known vulnerabilities)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      # Verifies the guardrails actually BLOCK, not merely that features work.
      # docs/11 §7.1 requires this to be a required check: if it can be skipped,
      # the dual-layer defence in D4 silently becomes optional.
      - name: Adversarial tests
        run: npm run test:adversarial

      # Full work-item flow with a stub agent (docs/11 §4.3). A stub keeps this
      # deterministic, so a failure means the wiring broke — not that a model
      # had an off day.
      - name: E2E tests
        run: npm run test:e2e

      # Coverage thresholds are a gate, not a report: scoring and stop-rule code
      # must hold 100% branch coverage because an untested branch there is an
      # unverified permission path (docs/11 §6).
      - name: Coverage thresholds
        run: npm run coverage
