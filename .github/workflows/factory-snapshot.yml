# 流程快照（ADR-024 資料路徑）：把 factory-graph ＋ factory-next 的輸出發佈成
# rolling release，供 Scoreboard 讀取——Worker 不重算任何判定（ADR-001、ADR-023 §2）。
#
# 系統清單**不寫在這支 workflow 裡**：真實租戶系統的登記就是機制 repo 的
# `processes/<owner>/<repo>.yaml`（aswf.dev 後台以「存檔＝開 PR」建立、人類審核合併）。
# discover job 列出它們，snapshot job 以 matrix 逐一產生，publish job 合併後發佈。
# 新增租戶不必再改 `.github/workflows/**`（H5）。
#
# 合成系統（processes/samples/*）用離線 fixture 產生；index.json 以 `sample: true` 標示，
# consumer 不得當成真實納管資料。
name: Factory Snapshot

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 發佈到 snapshot-latest（false＝只產生並上傳 artifact，用來驗證變更）
        type: boolean
        default: true
  schedule:
    # 每日 00:00 UTC（台北 08:00）。快照是唯讀產物，延遲一天不影響判定。
    - cron: '0 0 * * *'

permissions:
  # 發佈 rolling release 需要寫入；除此之外只讀 Issue。
  contents: write
  issues: read

concurrency:
  group: factory-snapshot
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      systems: ${{ steps.list.outputs.systems }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLIs
        run: pnpm build

      - name: List real systems (processes/<owner>/<repo>.yaml)
        id: list
        run: |
          set -euo pipefail
          node --input-type=module -e '
          import fs from "node:fs";
          import { discoverSystems } from "./dist/process/systems.js";
          const reader = {
            readdir: (p) => fs.readdirSync(p),
            isDirectory: (p) => fs.statSync(p).isDirectory(),
          };
          const { systems, skipped } = discoverSystems(reader);
          for (const path of skipped) console.error(`::warning::略過名稱不合法的 spec：${path}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `systems=${JSON.stringify(systems)}\ncount=${systems.length}\n`);
          console.log(JSON.stringify(systems, null, 2));
          '

  snapshot:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      # 一個租戶失敗不取消其他租戶。
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.discover.outputs.systems) }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLIs
        run: pnpm build

      # GITHUB_TOKEN 只涵蓋機制 repo，因此用 factory App token 讀目標 repo。
      - name: Create factory App token (target repo read)
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ matrix.system.owner }}
          repositories: ${{ matrix.system.repo }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read

      # 模板路徑由 spec 的 `template` 推導；模組清單與追蹤 Issue（標題以 [tracking]
      # 開頭、編號最小者）都可選——缺了只會在快照 warnings 說明。
      # matrix 值一律經 env 傳入，不直接內插進 shell（避免 script injection）。
      - name: Generate snapshot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ matrix.system.system }}
          SPEC: ${{ matrix.system.spec }}
          OUT_FILE: ${{ matrix.system.owner }}--${{ matrix.system.repo }}.json
        run: |
          set -euo pipefail
          TEMPLATE_ID="$(node -e 'const y=require("js-yaml");console.log(y.load(require("fs").readFileSync(process.argv[1],"utf8")).template)' "$SPEC")"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          WORK="$RUNNER_TEMP/factory-snapshot"
          mkdir -p "$WORK" out
          extra=()
          if gh api "repos/$TARGET/contents/factory/process.yaml" --jq .content 2>/dev/null | base64 -d > "$WORK/modules.yaml" 2>/dev/null && [ -s "$WORK/modules.yaml" ]; then
            extra+=(--modules "$WORK/modules.yaml")
          fi
          gh issue list --repo "$TARGET" --state all --limit 200 \
            --json number,title,body,labels,state > "$WORK/issues.json"
          TRACKING="$(node -e 'const a=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).filter(i=>i.title.startsWith("[tracking]")).sort((x,y)=>x.number-y.number);console.log(a[0]?a[0].number:"")' "$WORK/issues.json")"
          if [ -n "$TRACKING" ]; then
            gh api --paginate --slurp "repos/$TARGET/issues/$TRACKING/comments" > "$WORK/comments.json"
            extra+=(--tracking-issue "$TRACKING" --comments-file "$WORK/comments.json")
          fi
          node dist/cli/factory-snapshot.js \
            --repo "$TARGET" \
            --system "$TARGET" \
            --process "$SPEC" \
            --template "templates/$TEMPLATE_ID.yaml" \
            --issues-file "$WORK/issues.json" \
            --signer-permissions resolve \
            ${extra[@]+"${extra[@]}"} \
            --generated-at "$generated_at" > "$WORK/snapshot.json"
          # 閘門摘要寫進 job log：簽核者權限查詢（#126）是否生效，不必下載快照也看得到。
          node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log("gates:",s.graph.gates.map(g=>g.id+"="+g.state+(g.signed_by?"("+g.signed_by+")":"")).join(", "));for(const w of s.warnings.filter(w=>/簽核權限|查不到/.test(w)))console.log("::warning::"+w)' "$WORK/snapshot.json"
          # 成功才搬進 out/：半套 JSON 會讓 publish 的 Build index 解析失敗。
          mv "$WORK/snapshot.json" "out/$OUT_FILE"

      - uses: actions/upload-artifact@v7
        with:
          name: snapshot-${{ matrix.system.owner }}--${{ matrix.system.repo }}
          path: out/*.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [discover, snapshot]
    # 個別租戶失敗（snapshot 為 failure）仍要發佈其他系統；只有 discover 失敗或取消才停。
    # 手動執行且 publish=false 時不發佈。
    #
    # 2026-10-31 事故：原本寫 `inputs.publish != false`，本意是「排程沒有 inputs 就照常發佈」，
    # 但 GitHub 表示式把 null 與 false 視為相等（兩者都轉成 0），排程觸發時條件恆為 false
    # → 從 10-23 起每日排程的 publish 全部被跳過，snapshot-latest 停在 10-22。改成先看
    # 觸發方式：非手動（排程）一律發佈，手動才看 publish 輸入（布林值，不用字串比較）。
    if: ${{ !cancelled() && needs.discover.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLIs
        run: pnpm build

      - name: Generate snapshot (sample system, offline fixtures)
        run: |
          set -euo pipefail
          mkdir -p out
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node dist/cli/factory-snapshot.js \
            --repo aswf-dev/payment-platform \
            --system aswf-dev/payment-platform \
            --process processes/samples/payment-platform.yaml \
            --template templates/factory/M.yaml \
            --modules processes/samples/payment-platform.modules.yaml \
            --issues-file processes/samples/payment-platform.issues.json \
            --tracking-issue 391 \
            --comments-file processes/samples/payment-platform.comments.json \
            --generated-at "$generated_at" > out/payment-platform.json

          # 租戶模板範例（example/review-first@1）：示範 registry → live 的完整鏈路。
          node dist/cli/factory-snapshot.js \
            --repo example/portal \
            --system example/portal \
            --process processes/samples/example-portal.yaml \
            --template templates/example/review-first.yaml \
            --modules processes/samples/example-portal.modules.yaml \
            --issues-file processes/samples/example-portal.issues.json \
            --tracking-issue 900 \
            --comments-file processes/samples/example-portal.comments.json \
            --generated-at "$generated_at" > out/example-portal.json

      - name: Collect real-system snapshots
        uses: actions/download-artifact@v8
        # 沒有任何真實系統、或全部失敗時沒有 artifact——仍要發佈樣本。
        continue-on-error: true
        with:
          pattern: snapshot-*
          path: out
          merge-multiple: true

      # 今天失敗的系統沿用上一份已發佈的快照（generated_at 會如實顯示它過期），
      # 而不是從 index 消失、讓 live 頁直接導回索引。
      - name: Fall back to the last published snapshot for failed systems
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYSTEMS: ${{ needs.discover.outputs.systems }}
        run: |
          set -euo pipefail
          node -e 'for (const s of JSON.parse(process.env.SYSTEMS || "[]")) console.log(`${s.owner}--${s.repo}.json`)' > "$RUNNER_TEMP/expected.txt"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ ! -f "out/$file" ]; then
              if gh release download snapshot-latest --repo "$GITHUB_REPOSITORY" -p "$file" -D out >/dev/null 2>&1; then
                echo "::warning::$file 今天產生失敗，沿用上一份已發佈的快照"
              else
                echo "::warning::$file 今天產生失敗，且沒有可沿用的舊快照"
              fi
            fi
          done < "$RUNNER_TEMP/expected.txt"

      - name: Build index
        run: |
          set -euo pipefail
          node -e '
          const fs = require("node:fs");
          // 樣本系統（合成資料）用固定清單標記；其餘視為真實租戶系統。
          const SAMPLE_FILES = new Set(["payment-platform.json", "example-portal.json"]);
          const files = fs.readdirSync("out").filter((f) => f.endsWith(".json") && f !== "index.json").sort();
          const snapshots = files.map((f) => JSON.parse(fs.readFileSync(`out/${f}`, "utf8")));
          const index = {
            schema_version: 1,
            generated_at: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
            systems: snapshots.map((snapshot, i) => ({
              id: snapshot.system,
              repo: snapshot.source.github,
              sample: SAMPLE_FILES.has(files[i]),
              file: files[i],
              generated_at: snapshot.generated_at,
            })),
          };
          fs.writeFileSync("out/index.json", JSON.stringify(index, null, 2) + "\n");
          '

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view snapshot-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create snapshot-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "流程快照（rolling）" \
              --notes "由 factory-snapshot workflow 產生。index.json 的 sample: true 代表合成系統；sample: false 是真實租戶系統。"
          fi
          gh release upload snapshot-latest out/*.json --clobber --repo "$GITHUB_REPOSITORY"

      # 舊檔名（改名前的 <repo>.json）或已移除的系統會留在 release 裡；index 不再引用它們，
      # 這裡把 release 上「不在 out/」的 JSON 資產刪掉，避免誤用過期資料。
      - name: Remove orphaned snapshot assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view snapshot-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            case "$asset" in *.json) ;; *) continue ;; esac
            if [ ! -f "out/$asset" ]; then
              echo "刪除孤兒資產：$asset"
              gh release delete-asset snapshot-latest "$asset" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
