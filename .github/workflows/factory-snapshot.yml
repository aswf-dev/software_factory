# 流程快照（ADR-024 資料路徑）：把 factory-graph ＋ factory-next 的輸出發佈成
# rolling release，供 Scoreboard 讀取——Worker 不重算任何判定（ADR-001、ADR-023 §2）。
#
# 目前只有合成系統（processes/samples/*），用離線 fixture 產生；index.json 以
# `sample: true` 標示，consumer 不得當成真實納管資料。
# 真實系統納管後（processes/<system>.yaml），在同一支 workflow 加對應 step，
# 改讀目標 repo 的 factory/process.yaml 與 tracking issue 即可。
name: Factory Snapshot

on:
  workflow_dispatch:
  schedule:
    # 每日 00:00 UTC（台北 08:00）。快照是唯讀產物，延遲一天不影響判定。
    - cron: '0 0 * * *'

permissions:
  # 發佈 rolling release 需要寫入；除此之外只讀 Issue。
  contents: write
  issues: read

concurrency:
  group: factory-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLIs
        run: pnpm build

      - name: Generate snapshot (sample system, offline fixtures)
        run: |
          set -euo pipefail
          mkdir -p out
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node dist/cli/factory-snapshot.js \
            --repo aswf-dev/payment-platform \
            --system aswf-dev/payment-platform \
            --process processes/samples/payment-platform.yaml \
            --template templates/factory/M.yaml \
            --modules processes/samples/payment-platform.modules.yaml \
            --issues-file processes/samples/payment-platform.issues.json \
            --tracking-issue 391 \
            --comments-file processes/samples/payment-platform.comments.json \
            --generated-at "$generated_at" > out/payment-platform.json

          # 租戶模板範例（example/review-first@1）：示範 registry → live 的完整鏈路。
          node dist/cli/factory-snapshot.js \
            --repo example/portal \
            --system example/portal \
            --process processes/samples/example-portal.yaml \
            --template templates/example/review-first.yaml \
            --modules processes/samples/example-portal.modules.yaml \
            --issues-file processes/samples/example-portal.issues.json \
            --tracking-issue 900 \
            --comments-file processes/samples/example-portal.comments.json \
            --generated-at "$generated_at" > out/example-portal.json

      # 真實租戶（agent-playground/restate-cloudflare-workers-poc）：資料在目標 repo。
      # GITHUB_TOKEN 只涵蓋機制 repo，因此用 factory App token 讀目標 repo 的
      # factory/process.yaml 與 Issues。
      - name: Create factory App token (target repo read)
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: agent-playground
          repositories: restate-cloudflare-workers-poc
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read

      - name: "Generate snapshot (real system: agent-playground/restate-cloudflare-workers-poc)"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          TARGET=agent-playground/restate-cloudflare-workers-poc
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 暫存檔放 /tmp：out/ 只用來放要發佈的快照。
          mkdir -p /tmp/factory-snapshot
          gh api "repos/$TARGET/contents/factory/process.yaml" --jq .content | base64 -d > /tmp/factory-snapshot/modules.yaml
          gh issue list --repo "$TARGET" --state all --limit 200 \
            --json number,title,body,labels,state > /tmp/factory-snapshot/issues.json
          gh api --paginate --slurp "repos/$TARGET/issues/65/comments" > /tmp/factory-snapshot/comments.json
          node dist/cli/factory-snapshot.js \
            --repo "$TARGET" \
            --system "$TARGET" \
            --process processes/agent-playground/restate-cloudflare-workers-poc.yaml \
            --template templates/agent-playground/review-first.yaml \
            --modules /tmp/factory-snapshot/modules.yaml \
            --issues-file /tmp/factory-snapshot/issues.json \
            --tracking-issue 65 \
            --comments-file /tmp/factory-snapshot/comments.json \
            --generated-at "$generated_at" > out/restate-cloudflare-workers-poc.json

      # 第二個真實租戶（tradingbot-tw/saga-pattern）。流程 spec 尚未建立前整段跳過；
      # App 未安裝或任何一步失敗都不影響其他系統的快照發佈（continue-on-error）。
      # 與上一段不同，這段是通用寫法：模板路徑由 spec 的 `template` 推導、模組清單與
      # 追蹤 Issue（標題以 [tracking] 開頭）都是可選的——缺了只會在快照 warnings 說明。
      - name: Create factory App token (tradingbot-tw/saga-pattern read)
        id: app-token-saga
        if: hashFiles('processes/tradingbot-tw/saga-pattern.yaml') != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: tradingbot-tw
          repositories: saga-pattern
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read

      - name: "Generate snapshot (real system: tradingbot-tw/saga-pattern)"
        if: steps.app-token-saga.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token-saga.outputs.token }}
        run: |
          set -euo pipefail
          TARGET=tradingbot-tw/saga-pattern
          SPEC=processes/tradingbot-tw/saga-pattern.yaml
          TEMPLATE_ID="$(node -e 'const y=require("js-yaml");console.log(y.load(require("fs").readFileSync(process.argv[1],"utf8")).template)' "$SPEC")"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          WORK=/tmp/factory-snapshot-saga
          mkdir -p "$WORK"
          extra=()
          # 模組清單（目標 repo 預設分支的 factory/process.yaml）：沒有就不帶 --modules。
          if gh api "repos/$TARGET/contents/factory/process.yaml" --jq .content 2>/dev/null | base64 -d > "$WORK/modules.yaml" 2>/dev/null && [ -s "$WORK/modules.yaml" ]; then
            extra+=(--modules "$WORK/modules.yaml")
          fi
          gh issue list --repo "$TARGET" --state all --limit 200 \
            --json number,title,body,labels,state > "$WORK/issues.json"
          # 追蹤 Issue：標題以 [tracking] 開頭的第一張（編號最小）；沒有就不讀閘門留言。
          TRACKING="$(node -e 'const a=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).filter(i=>i.title.startsWith("[tracking]")).sort((x,y)=>x.number-y.number);console.log(a[0]?a[0].number:"")' "$WORK/issues.json")"
          if [ -n "$TRACKING" ]; then
            gh api --paginate --slurp "repos/$TARGET/issues/$TRACKING/comments" > "$WORK/comments.json"
            extra+=(--tracking-issue "$TRACKING" --comments-file "$WORK/comments.json")
          fi
          node dist/cli/factory-snapshot.js \
            --repo "$TARGET" \
            --system "$TARGET" \
            --process "$SPEC" \
            --template "templates/$TEMPLATE_ID.yaml" \
            --issues-file "$WORK/issues.json" \
            ${extra[@]+"${extra[@]}"} \
            --generated-at "$generated_at" > "$WORK/snapshot.json"
          # 成功才搬進 out/：半套檔案會讓 Build index 解析失敗、拖垮所有系統的發佈。
          mv "$WORK/snapshot.json" out/saga-pattern.json

      - name: Build index
        run: |
          set -euo pipefail
          node -e '
          const fs = require("node:fs");
          // 樣本系統（合成資料）用固定清單標記；其餘視為真實租戶系統。
          const SAMPLE_FILES = new Set(["payment-platform.json", "example-portal.json"]);
          const files = fs.readdirSync("out").filter((f) => f.endsWith(".json") && f !== "index.json").sort();
          const snapshots = files.map((f) => JSON.parse(fs.readFileSync(`out/${f}`, "utf8")));
          const index = {
            schema_version: 1,
            generated_at: snapshots[0].generated_at,
            systems: snapshots.map((snapshot, i) => ({
              id: snapshot.system,
              repo: snapshot.source.github,
              sample: SAMPLE_FILES.has(files[i]),
              file: files[i],
              generated_at: snapshot.generated_at,
            })),
          };
          fs.writeFileSync("out/index.json", JSON.stringify(index, null, 2) + "\n");
          '

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view snapshot-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create snapshot-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "流程快照（rolling）" \
              --notes "由 factory-snapshot workflow 產生。index.json 的 sample: true 代表合成系統；sample: false 是真實租戶系統。"
          fi
          gh release upload snapshot-latest out/*.json --clobber --repo "$GITHUB_REPOSITORY"
