# Factory Run — 一個工作項的端到端執行（docs/02 §4, docs/04 §4.1）。
#
# 第 1 期範圍（docs/09 §2）：任務類型僅 agent-add-tests；全程人類審查，
# 永不自動合併。dry_run=true 時以 stub agent 取代真實 DSH，用於在沒有
# LLM key 的 CI 上驗證流程接線。
name: Factory Run

# run-name 供 factory-run-cleanup.yml（G2）在 workflow_run 事件中解析目標
# （repo + issue）；格式由該 workflow 的解析規則釘住，改動須兩邊同步
# （對抗性測試 factory-assets 也會釘住兩者的契約）。
#
# ⚠️ YAML 陷阱（2026-08 實測）：plain scalar 中的 ` #` 會被 YAML 當成註解——
# 未加引號時 run-name 解析值只剩 `Factory Run (${{ inputs.repo }}`，`#<issue>)`
# 整段消失，cleanup 的解析正則失配。必須以雙引號包裹，`#` 才是字面值。
run-name: "Factory Run (${{ inputs.repo }} #${{ inputs.issue_number }})"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 目標 Issue 編號
        required: true
        type: number
      task_type:
        description: 任務類型（決定 task-template 與 skill 分支）；auto = 以 Issue 宣告為準
        required: false
        type: choice
        options: [auto, agent-add-tests, agent-fix-bug, agent-update-deps, agent-write-docs, agent-write-spec, agent-analyze, agent-propose-skill, agent-pbt-audit]
        default: auto
      repo:
        description: 目標 repo（owner/name）；預設本 repo（docs/09 §2.2）
        required: false
        type: string
        default: aswf-dev/software_factory
      base_branch:
        description: 工廠 trunk 分支（PR 合併目標）。⚠️ 統一規則（ADR-013）：一律 software-factory，不得為 main（Q-P2-1）
        required: false
        type: string
        default: software-factory
      dry_run:
        description: 以 stub agent 取代真實 DSH（驗證流程用）
        required: false
        type: boolean
        default: false
      dry_run_scenario:
        description: dry_run 情境：success | blocked | guardrail
        required: false
        type: choice
        options: [success, blocked, guardrail]
        default: success
      model_tier:
        description: 模型 tier（auto＝依 Issue 複雜度自動選擇；low/medium→qwen3.8-flash、high→deepseek-flash、critical→claude-opus-5，ADR-011）
        required: false
        type: choice
        options: [auto, low, medium, high, critical]
        default: auto
      model_provider:
        description: 模型 provider 偏好（auto＝不偏好；非 auto 時該 provider 置於 chain 前，失敗仍依 chain fallback，Q04-8/ADR-011）
        required: false
        type: choice
        options: [auto, deepseek, qwen, anthropic]
        default: auto
      token_budget:
        description: 單一工作項 token 上限（0 = 不設限）。B8 基線：34735315950 實測 19.4M token 仍逾時，故 heavy-verify 類建議設 25000000；judge 讀此值觸發 SR7 停手規則
        required: false
        type: number
        default: 0
      agent_timeout_minutes:
        description: Agent 步驟逾時分鐘數（0 = 自動：依 model.json 的計算強度，heavy-verify 用 110、其餘 50）
        required: false
        type: number
        default: 0

concurrency:
  group: factory-${{ inputs.repo }}-${{ inputs.issue_number }}
  cancel-in-progress: false   # 不取消進行中的執行，避免產生半成品（docs/04 §4.3）

permissions:
  # 全部 gh 操作改用 GitHub App token（D6）；GITHUB_TOKEN 僅保留最小讀取。
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # job 級逾時是 step 逾時的**上限**：A1 讓 heavy-verify 的 agent step 需要 115 分，
    # 若 job 仍留 60 分，step 永遠跑不到自己的預算就被 job 砍掉（且 job 逾時不會
    # 觸發 step 的失敗處理 → 終態留言可能缺失）。取 150 分＝最大 step 預算 115 分
    # ＋其餘步驟（setup/usage/judge/上傳）約 35 分餘裕。
    # ADR-018 §7：write-spec 模型階段在 agent 之後還有集中驗證（step 上限 35 分），
    # 同一個 run 內兩者都可能用滿，故再加 35 分 → 185 分。這只是上限：一般工作項
    # 不會因此跑得更久，只是保證驗證步驟不會在中途被 job 逾時砍掉。
    timeout-minutes: 185
    strategy:
      fail-fast: false
      matrix:
        variant: [a, b]
    steps:
      # 機制 repo（本 repo：workflow/CLI/skill 所在）在根目錄；
      # 目標 repo（inputs.repo）另行 checkout 至 target/，agent 在 target/ 內工作。
      - uses: actions/checkout@v7

      # 安全約束（Q-P2-1 統一，ADR-013）：所有 repo（含機制 repo 自身）的 factory trunk
      # 一律為 software-factory 分支，main 絕不觸碰。Guard 在花費任何成本（token/LLM）
      # 之前就擋下（純 shell 檢查、零成本）；trunk 分支存在性檢查移到 App token mint 之後
      # （2026-09-01 T3 試點實測抓到：此處用 github.token 查跨 repo 必然 404——
      # GITHUB_TOKEN 只授權機制 repo，跨 repo 路徑先前從未被實測）。
      - name: Guard base_branch safety (Q-P2-1 統一)
        run: |
          if [ "${{ inputs.base_branch }}" == "main" ]; then
            echo "::error::base_branch 不得為 main（Q-P2-1 統一安全約束：所有 repo 的 main 絕不觸碰，trunk 一律 software-factory）"
            exit 1
          fi
          echo "guard ok: repo=${{ inputs.repo }} base_branch=${{ inputs.base_branch }}"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
          cache: pnpm

      # D6：以 GitHub App 身分換發短效 installation token。
      # App 權限最小化（Contents/PRs/Issues RW、Actions/Metadata R），
      # 無 Administration/Workflows —— agent 無法修改 guardrail 自身。
      # repositories 限定目標 repo（最小權限；App 需已安裝於目標 repo）。
      # ⚠️ owner 必須顯式傳入：該 action 的 owner 預設為「當前 repo 的 owner」
      # （即 aswf-dev），且 repositories 只收**不含 owner 的 repo 名**。跨 owner
      # 時直接傳 owner/name 會被擋下——2026-09-01 實測 run 33523314113：
      # "Repository '...' includes owner 'agent-playground', which does not
      # match the resolved owner 'philipz'"。故拆成 owner + 純 repo 名。
      # Actions 運算式沒有 split()（內建僅 contains/startsWith/format/join/…），
      # 故以 shell 拆出 owner 與純 repo 名。
      - name: Resolve target owner/name
        id: target
        env:
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          case "$TARGET_REPO" in
            */*) ;;
            *) echo "::error::inputs.repo 必須為 owner/name 格式，實得：$TARGET_REPO"; exit 1 ;;
          esac
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          # 明列權限（App 將有 actions:write，見 factory-scoreboard 送單設計）：
          # 未列者不授予，agent 拿到的 token 只能讀 Actions。
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read

      # 分支存在性檢查（#171 教訓 fast-fail）：不存在的 trunk 會在 checkout 才炸，
      # 此處以 App token 提前擋下。**必須用 App token**——GITHUB_TOKEN 只授權機制 repo，
      # 查目標 repo 必然 404（2026-09-01 T3 試點實測抓到，跨 repo 路徑首度被實測）。
      - name: Verify trunk branch exists (cross-repo)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          if ! gh api "repos/${{ inputs.repo }}/git/ref/heads/${{ inputs.base_branch }}" >/dev/null 2>&1; then
            echo "::error::目標 repo ${{ inputs.repo }} 不存在分支 base_branch=${{ inputs.base_branch }}"
            echo "::error::統一規則：所有 repo 的 factory trunk 皆為 software-factory 分支（main 絕不觸碰）"
            exit 1
          fi
          echo "trunk exists: ${{ inputs.repo }}@${{ inputs.base_branch }}"

      # 目標 repo checkout（工廠 trunk = base_branch）：agent 在此工作，
      # catalog/risk-paths/templates/skills 均從此讀取（Q-P2-1：main 絕不觸碰）。
      # 用 App token 認證——GITHUB_TOKEN 只限本 repo，無法讀取目標 repo。
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.base_branch }}
          path: target
          token: ${{ steps.app-token.outputs.token }}

      # Quint evaluator 與 Apalache 快取（~/.quint）——write-spec 的集中驗證（ADR-018 §7）
      # 會用到；並行 run 直接下載會撞 GitHub rate limit（#234），做法同 quint-verify.yml。
      - name: Cache Quint toolchain
        uses: actions/cache@v6
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            quint-${{ runner.os }}-

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # 標籤必須預先存在（gh issue edit --add-label 不會自動建立，缺一個整條指令失敗）。
      # 冪等：--force 在已存在時更新顏色而不報錯。
      # GH_REPO 讓 gh 指向目標 repo（預設是本 repo 的 origin）。
      #
      # ⚠️ 這份清單必須涵蓋 src/labels.ts 的 FACTORY_LABELS 全部成員——
      # test/adversarial/factory-assets.test.ts 會比對兩邊，漏一個即紅燈。
      # 實測 run 34731487680（Issue #287）：skill-gap 只加了發射端（docs/20 E4）
      # 沒加這裡，agent 的工作已經成功（crosscheck 過、judge 出終態、PR 已開），
      # 卻在收尾 `gh issue edit --add-label oversight/review,skill-gap` exit 1，
      # 整個 run 被標成 failure 並貼 needs-human——成功的執行被偽裝成失敗。
      - name: Ensure factory labels exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          gh label create "oversight/on-loop"  --color "1d76db" --force
          gh label create "oversight/review"   --color "d4c5f9" --force
          gh label create "oversight/in-loop"  --color "d73a4a" --force
          gh label create "needs-human"        --color "b60205" --force
          gh label create "ready"              --color "0e8a16" --force
          gh label create "skill-gap"          --color "fbca04" --force
          # agent-write-spec 狀態機（ADR-018 §3、Q29）。approved／model-declined 由人貼上，
          # 但必須先存在，人才貼得上去——一併建立。
          gh label create "spec/phase-invariants" --color "c5def5" --force
          gh label create "spec/approved"         --color "0e8a16" --force
          gh label create "spec/phase-model"      --color "5319e7" --force
          gh label create "spec/model-declined"   --color "cccccc" --force
          gh label create "spec/model-outdated"   --color "e99695" --force
          # agent-pbt-audit（ADR-019 R2）：判定類型後自動貼上，只用於篩選與試行統計。
          gh label create "pbt/audit"             --color "bfd4f2" --force
          echo "factory labels ensured ($GH_REPO)"

      # 集中式 Issue 格式檢查（ADR-012）：檢查邏輯只存在機制 repo（dist CLI），
      # 目標 repo 不再複製 factory-issue-check.yml——每次 dispatch 在此執行一次，
      # 留言含「格式合規＋複雜度分析＋建議模型」三行（ADR-011），不合規即紅燈停派。
      # 目標 repo 的舊副本已刪除（DRIFT-ELIMINATION）；此步驟取代它。
      - name: Check issue format (central enforcement)
        env:
          # gh 在 Actions 不會自動用 GITHUB_TOKEN——需顯式傳（2026-08-19 實測）
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          mkdir -p .factory
          # --risk-paths 讀目標 repo（target/ 已於前一步 checkout）：事前風險路徑
          # 比對為 advisory（只留言，不改紅綠燈）——初始計分收不到 changedPaths，
          # 此提示是 agent 啟動前唯一的風險訊號（factory-scoreboard#3 實證）。
          # --catalog／--target-root（ADR-018 §4、§5）：agent-write-spec 的使用門檻
          #（H 規則或 quint-spec 標註）與規格來源存在性，只有在這裡拿得到目標 repo
          # 的設定與檔案樹，故在 dispatch 時強制判定；機制 repo 的 issues 事件只做提示。
          node dist/cli/factory-issue-check.js \
            "${{ inputs.issue_number }}" \
            --tiers config/dsh/model-tiers.yaml \
            --providers config/dsh/settings.providers.yaml \
            --risk-paths target/.github/factory/risk-paths.yml \
            --catalog target/catalog-info.yaml \
            --target-root target \
            > .factory/issue-check.txt 2>&1 || true
          cat .factory/issue-check.txt
          gh issue comment "${{ inputs.issue_number }}" --body-file .factory/issue-check.txt
          # 不合規 → exit 1（紅燈停派；與機制 repo 自身 factory-issue-check 同語意）
          if grep -q '格式不合規' .factory/issue-check.txt; then
            echo "::error::Issue 格式不合規（factory-issue-check）——停止派工，請依留言修正後重新 dispatch"
            exit 1
          fi
          echo "格式合規"

      # 任務類型以 **Issue 為準**（docs/02 §3.2：Issue 是工作項契約）。
      #
      # 實測（Issue #287，2026-09-13）：Issue body 宣告 agent-fix-bug，但 dispatch
      # 漏帶 -f task_type，input 的預設值 agent-add-tests 靜默生效——agent 收到
      # task-template-add-tests.txt，完全照 add-tests 規矩走（test-only、缺陷以
      # it.skip 交付），實作與文件兩層從未產生。整個 run 是綠的，沒有任何訊息
      # 說明「你派的類型不是 Issue 宣告的類型」。
      #
      # 修法：預設改為 auto → 從 Issue body 解析。解析呼叫 dist 的 checkIssue
      # （FIELD_TITLES 的權威實作），不自寫正則——factory-issue-check.yml 曾各寫
      # 一份，那正是漂移的來源。人類仍可顯式指定覆寫，但會留下 ::notice:: 稽核痕跡。
      - name: Resolve task_type (Issue 為準)
        id: tasktype
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
          REQUESTED: ${{ inputs.task_type }}
        run: |
          set -euo pipefail
          DECLARED=$(gh issue view "${{ inputs.issue_number }}" --json body --jq .body \
            | node -e '
              let s = ""
              process.stdin.on("data", (d) => (s += d)).on("end", async () => {
                const { checkIssue } = await import("./dist/cli/factory-issue-check.js")
                process.stdout.write(checkIssue(s).taskType ?? "")
              })')
          echo "issue 宣告的任務類型: ${DECLARED:-（無法解析）}"
          if [ "$REQUESTED" = "auto" ]; then
            if [ -z "$DECLARED" ]; then
              echo "::error::task_type=auto 但 Issue #${{ inputs.issue_number }} 的任務類型欄位無法解析。請修正 Issue，或 dispatch 時顯式指定 task_type。"
              exit 1
            fi
            RESOLVED="$DECLARED"
          else
            RESOLVED="$REQUESTED"
            if [ -n "$DECLARED" ] && [ "$DECLARED" != "$REQUESTED" ]; then
              echo "::notice::dispatch 指定 task_type=$REQUESTED，與 Issue 宣告的 $DECLARED 不同——以 dispatch 為準（人類覆寫）。"
            fi
          fi
          echo "resolved task_type: $RESOLVED"
          echo "value=$RESOLVED" >> "$GITHUB_OUTPUT"

      # DSH 的 sandbox 不會把 GH_TOKEN 傳進 agent 的 process 環境（實測：
      # step 層的 gh 可用 App token，但 agent 內的 gh 看不到任何 token）。
      # 故把短效 installation token 寫入目標 repo 的 workspace（gitignored、
      # runner 暫存、1 小時有效），由 factory-workflow skill 指示 agent 讀取。
      # 同檔也寫 base_branch 與 repo：agent 的 env 被 DSH 剝離，工作目錄
      # 又是目標 repo——這兩個值以檔案傳遞（skill 指示讀取）。
      - name: Write agent run env (token / base / repo)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p target/.factory/run
          printf '%s' "$GH_TOKEN" > target/.factory/run/gh-token
          printf '%s' "${{ inputs.base_branch }}" > target/.factory/run/base-branch
          printf '%s' "${{ inputs.repo }}" > target/.factory/run/repo
          printf '%s' "${{ matrix.variant }}" > target/.factory/run/variant
          echo "run env written: token=$(wc -c < target/.factory/run/gh-token)B base=$(cat target/.factory/run/base-branch) repo=$(cat target/.factory/run/repo) variant=$(cat target/.factory/run/variant)"

      # token 安全：目標 repo 未必有 .factory/ 的 gitignore 條目——若 agent 的
      # git add -A 把 .factory/run/gh-token 提交上去會外洩憑證。以 repo 本地的
      # .git/info/exclude 排除（不改動目標 repo 的檔案內容，無需 commit）。
      - name: Exclude .factory from target repo (token safety)
        run: |
          cd target
          grep -qxF '.factory/' .git/info/exclude || printf '\n.factory/\n' >> .git/info/exclude
          echo "target .git/info/exclude ignores .factory/"

      # git push 的認證（在 target/ 目標 repo checkout 內）：checkout action 把
      # `http.https://github.com/.extraheader`（AUTHORIZATION: basic GITHUB_TOKEN）
      # 寫在**獨立 credentials 檔**，經 `includeIf.gitdir:<path>/.git.path` 引入——
      # git config --unset-all 只清直接項目、清不掉 includeIf 引入的檔。故必須移除
      # includeIf 項目，再以 URL 內嵌 App token 認證（本機實測：App token 可 push）。
      - name: Configure agent git auth (target repo)
        run: |
          cd target
          git config --local --get-regexp '^includeIf\.gitdir:' 2>/dev/null | while read -r key _; do
            git config --local --unset-all "$key"
          done || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          TOKEN=$(cat .factory/run/gh-token)
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ inputs.repo }}.git"
          echo "target checkout credentials include removed; origin authenticates with app token"

      # git 身分：checkout 預設不設定 user.name/email，git commit 會失敗。
      # 以 App 的 bot 身分提交（稽核可辨識，docs/02 D6）。
      - name: Configure agent git identity (target repo)
        run: |
          cd target
          git config --local user.name "softwarefactory-bot[bot]"
          git config --local user.email "softwarefactory-bot[bot]@users.noreply.github.com"
          echo "git identity: softwarefactory-bot[bot]"

      # gh-stack 需要本地 base 分支（gh stack init --base $BASE_BRANCH）。
      # checkout action 對 branch ref 會建同名本地分支，但這裡明確確保：
      # 分支存在且在 HEAD；輸入錯誤的 base_branch 在此 fast fail。
      - name: Ensure base branch checked out in target
        run: |
          cd target
          git checkout -B "${{ inputs.base_branch }}" "origin/${{ inputs.base_branch }}" 2>/dev/null || \
            git checkout "${{ inputs.base_branch }}"
          echo "HEAD on: $(git rev-parse --abbrev-ref HEAD) ($(git rev-parse --short HEAD))"

      # 寫入權限探針：在花費 LLM 成本之前確認 App token 真的能 push。
      # 失敗即在此紅燈（fast fail），不進入 agent 步驟。
      # 診斷：checkout 的 extraheader 可能位於 env 層（GIT_CONFIG_* env vars，
      # 優先級高於 file config，git config --unset-all 清不掉）——故探針以
      # command-line config（-c，優先級最高）強制清空 extraheader 再 push。
      - name: Verify app token write access (target repo)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cd target
          echo "=== git env config ==="
          env | grep -i "^GIT_CONFIG" || echo "(no GIT_CONFIG env vars)"
          echo "=== extraheader origins ==="
          git config --show-origin --get-all http.https://github.com/.extraheader || echo "(none in file config)"
          echo "=== remote url (masked) ==="
          git config --get remote.origin.url | sed 's/:[^@]*@/:***@/'
          echo "=== probe push (extraheader forced empty via -c) ==="
          # 平行 run 共用同名探針分支會互相衝突（fetch first），故以 run id 唯一化
          PROBE="_factory-auth-probe-${{ github.run_id }}"
          git switch -c "$PROBE"
          git commit --allow-empty -m "auth probe"
          git -c http.https://github.com/.extraheader= push origin "$PROBE"
          git -c http.https://github.com/.extraheader= push origin --delete "$PROBE"
          git switch - 2>/dev/null || true
          echo "app token write access verified (${{ inputs.repo }})"

      # Step 2 — 初始計分（agent 啟動前，docs/06 §5.1）。
      # catalog/risk-paths 讀目標 repo（target/），不再是本 repo 根。
      # ADR-018 §12：agent-write-spec 的階段判定——在任何 LLM 成本發生前執行。
      # 階段完全由狀態推導（Issue 標籤、spec/approved 的貼標者、進行中的 PR、trunk 上
      # 的 invariants.qnt），不提供指定階段的 input。放在所有 checkout 之後：
      # invariants.qnt 的存在性要看 trunk，CI 寫入的 source.md 也不能被 checkout -B 蓋掉。
      # 拒絕時比照「格式不合規」：留言說明後以 exit 1 停止（agent 未啟動，守衛不動作）。
      - name: Resolve write-spec phase (ADR-018)
        id: specphase
        if: steps.tasktype.outputs.value == 'agent-write-spec'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          mkdir -p .factory
          node dist/cli/factory-spec-phase.js "${{ inputs.issue_number }}" \
            --repo "${{ inputs.repo }}" --target target \
            --snapshot-out .factory/spec-source-snapshot.md \
            > .factory/spec-phase.json
          cat .factory/spec-phase.json
          DECISION=$(jq -r .decision .factory/spec-phase.json)
          REASON=$(jq -r .reason .factory/spec-phase.json)
          if [ "$DECISION" = "refuse" ]; then
            printf '🛑 **規格流程停止派工**（ADR-018 §12，run: %s）：%s\n\nagent 未啟動，未產生 LLM 成本。\n' \
              "${{ github.run_id }}" "$REASON" > .factory/spec-phase-comment.txt
            gh issue comment "${{ inputs.issue_number }}" --body-file .factory/spec-phase-comment.txt
            echo "::error::write-spec 階段判定拒絕派工：$REASON"
            exit 1
          fi
          ADD=$(jq -r '.labelsToAdd | join(",")' .factory/spec-phase.json)
          REMOVE=$(jq -r '.labelsToRemove | join(",")' .factory/spec-phase.json)
          if [ -n "$ADD" ]; then gh issue edit "${{ inputs.issue_number }}" --add-label "$ADD"; fi
          if [ -n "$REMOVE" ]; then gh issue edit "${{ inputs.issue_number }}" --remove-label "$REMOVE"; fi
          SPEC_NAME=$(jq -r .specName .factory/spec-phase.json)
          # agent 讀取的階段資訊（任務模板另以 <SPEC_PHASE>／<SPEC_NAME> 帶入）
          mkdir -p target/.factory/run
          jq '{phase: .decision, specName, sourceKind}' .factory/spec-phase.json > target/.factory/run/spec.json
          printf '📐 **規格流程**（ADR-018，run: %s）：%s（規格 `specs/%s/`）\n' \
            "${{ github.run_id }}" "$REASON" "$SPEC_NAME" > .factory/spec-phase-comment.txt
          gh issue comment "${{ inputs.issue_number }}" --body-file .factory/spec-phase-comment.txt
          echo "phase=$DECISION" >> "$GITHUB_OUTPUT"
          echo "spec_name=$SPEC_NAME" >> "$GITHUB_OUTPUT"

      - name: Initial score
        id: score
        run: |
          mkdir -p .factory/run
          node dist/cli/factory-score.js \
            --catalog target/catalog-info.yaml \
            --risk-paths target/.github/factory/risk-paths.yml \
            > .factory/score.json
          cat .factory/score.json

      # in-loop → 貼標籤 + 留言，並以 exit 1 阻斷後續 agent 步驟
      - name: Apply score labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          # 第三參數 = task_type：agent-analyze 允許 in-loop 以「僅分析」模式執行
          # （docs/06 §4「僅可產出分析與方案」的實作，docs/20 C1）
          # 第四參數 = run_id：閘門留言內嵌 run id，讓終態守衛（G1／G2）能以
          # 「留言是否含此 run id」去重，不會把 gate 阻斷誤判為缺終態而補貼假訊息。
          node dist/cli/apply-score-labels.js \
            "${{ inputs.issue_number }}" .factory/score.json \
            "${{ steps.tasktype.outputs.value }}" \
            "${{ github.run_id }}"

      # 被擋下（in-loop）時說明並結束；agent 步驟會被 if: success() 跳過
      - name: Stop when in-loop
        if: failure()
        run: |
          echo "blocked-in-loop; agent 未啟動（docs/06 §4.3）"

      # agent-pbt-audit 前置檢查（ADR-019 R2、R3、前置作業）——agent 啟動前的硬性 gate。
      #
      # 為何是 gate 而不是 quint preflight 那種警告：Hegel 依賴沒裝好時，agent 一定會
      # 在 SR5（不得新增依賴）停下，白名單也不准它改 package.json——跑下去只是浪費整個
      # agent 預算。write-spec 沒裝 quint 還能部分完成，audit 沒有這種情況。
      #
      # 稽核目標在這裡重判一次：dispatch 可用 task_type 覆寫 Issue 宣告的類型，那時
      # 上面的 issue-check 沒有跑 audit 的檢查。失敗時留言（內嵌 run id，供 G1／G2
      # 去重）並貼 needs-human；agent 步驟因 if: success() 被跳過。
      - name: PBT audit preflight
        id: pbt-preflight
        if: steps.tasktype.outputs.value == 'agent-pbt-audit'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          set -uo pipefail
          gh issue edit "${{ inputs.issue_number }}" --add-label "pbt/audit"
          gh issue view "${{ inputs.issue_number }}" --json body > .factory/pbt-issue.json
          node dist/cli/factory-pbt-preflight.js \
            --issue-json .factory/pbt-issue.json \
            --target-root target > .factory/pbt-preflight.json
          PREFLIGHT_RC=$?
          cat .factory/pbt-preflight.json
          if [ "$PREFLIGHT_RC" -ne 0 ]; then
            if jq -e .comment .factory/pbt-preflight.json >/dev/null 2>&1; then
              jq -r .comment .factory/pbt-preflight.json > .factory/pbt-preflight.md
            else
              printf '❌ **PBT 稽核前置檢查無法執行**（run: %s）：factory-pbt-preflight 異常結束，詳見 run log。\n' "${{ github.run_id }}" > .factory/pbt-preflight.md
            fi
            gh issue comment "${{ inputs.issue_number }}" --body-file .factory/pbt-preflight.md
            gh issue edit "${{ inputs.issue_number }}" --add-label "needs-human"
            echo "::error::PBT 稽核前置檢查未通過——agent 未啟動"
            exit 1
          fi

      # Step 2.5 — 模型 tier 選擇（docs/ADR/011, docs/04 §7）。
      # 以「Issue 需求分析（零 LLM 成本）＋初始計分」決定 model chain；agent 步驟
      # 沿 chain 依序嘗試（provider 層失敗 fallback）。dry_run 也執行以驗證接線。
      - name: Select model tier
        id: model
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          mkdir -p .factory
          gh issue view "${{ inputs.issue_number }}" --json body > .factory/issue.json
          # write-spec：計算強度由階段決定（不變量不升級、模型強制 heavy-verify，ADR-018）
          SPEC_PHASE_FLAG=""
          if [ -n "${{ steps.specphase.outputs.phase }}" ]; then
            SPEC_PHASE_FLAG="--spec-phase ${{ steps.specphase.outputs.phase }}"
          fi
          node dist/cli/factory-model.js $SPEC_PHASE_FLAG \
            --issue .factory/issue.json \
            --score .factory/score.json \
            --tiers config/dsh/model-tiers.yaml \
            --providers config/dsh/settings.providers.yaml \
            --tier "${{ inputs.model_tier }}" \
            --provider "${{ inputs.model_provider }}" \
            > .factory/model.json
          cat .factory/model.json
          echo "model tier selected: $(jq -r .tier .factory/model.json) ($(jq -r .complexitySource .factory/model.json))"
          # 雙模型競賽（N-version matrix）：依據 matrix.variant 將對應變體置於 chain 首位
          VARIANT="${{ matrix.variant }}"
          if [ "$VARIANT" = "b" ]; then
            jq '.chain = [ .dual[1] ] + [ .chain[] | select(.model != .dual[1].model or .provider != .dual[1].provider) ]' .factory/model.json > .factory/model.json.tmp && mv .factory/model.json.tmp .factory/model.json
          else
            jq '.chain = [ .dual[0] ] + [ .chain[] | select(.model != .dual[0].model or .provider != .dual[0].provider) ]' .factory/model.json > .factory/model.json.tmp && mv .factory/model.json.tmp .factory/model.json
          fi
          echo "variant $VARIANT prioritized chain model: $(jq -r '.chain[0].provider + "/" + .chain[0].model' .factory/model.json)"

      # Step 2.6 — Agent 逾時預算（A1，34735315950 事故修正）。
      #
      # 事故：`Run factory agent` 的 timeout-minutes 硬編碼 50，且 step timeout 一旦
      # 觸發就是**直接砍掉 runner 上的 process**——agent 連寫 report 的機會都沒有
      # （該 run 的 report.json 是事後 fallback 補的），50 分鐘的工作全損。
      #
      # 修法兩層：
      #  1. 預算依 model.json 的計算強度浮動：heavy-verify（模型檢查/求解器迭代，
      #     見 src/issue-analysis/complexity.ts）→ 預設 110 分；其餘維持 50 分。
      #     依 **tier 而非只有 escalation** 判斷，因為「任務是 CPU-bound」這件事與
      #     「本次是否剛好才升 critical」無關。
      #  2. step 級 timeout 留 5 分餘裕給收尾步驟（usage/artifacts 上傳）。
      # `agent_timeout_minutes` input 非 0 時完全覆寫（人類手動止血）。
      - name: Compute agent timeout budget
        id: agent-timeout
        env:
          MODEL_JSON: ${{ github.workspace }}/.factory/model.json
          MANUAL_TIMEOUT: ${{ inputs.agent_timeout_minutes }}
        run: |
          MANUAL="${MANUAL_TIMEOUT:-0}"
          if [ "$MANUAL" != "0" ]; then
            EFFECTIVE="$MANUAL"
            BASIS="手動指定 agent_timeout_minutes=$MANUAL"
          else
            TIER=$(jq -r '.tier // "high"' "$MODEL_JSON" 2>/dev/null || echo high)
            ESCALATION=$(jq -r '.escalation // empty' "$MODEL_JSON" 2>/dev/null || true)
            if [ "$TIER" = "critical" ]; then
              # heavy-verify 強制升級或總分升級；heavy-verify 需要更長時間預算，
              # 因為 Apalache 迭代本質上無法在 50 分內收斂（事故實測）。
              if [ "$ESCALATION" = "heavy-verify" ]; then
                EFFECTIVE=110
                BASIS="tier=critical 且 escalation=heavy-verify"
              else
                EFFECTIVE=70
                BASIS="tier=critical（總分升級）"
              fi
            else
              EFFECTIVE=50
              BASIS="tier=$TIER"
            fi
          fi
          # step 級逾時：比內層 timeout(1) 多 5 分餘裕，讓 agent 有機會寫終態
          # （內層逾時是具名的；step 逾時是「連 report 都來不及寫」的最後防線，
          # 故 step 必須嚴格大於內層預算，且留足夠時間跑完 write-report）。
          STEP_TIMEOUT=$((EFFECTIVE + 5))
          echo "effective_minutes=$EFFECTIVE" >> "$GITHUB_OUTPUT"
          echo "step_timeout_minutes=$STEP_TIMEOUT" >> "$GITHUB_OUTPUT"
          echo "::notice::agent 逾時預算 ${EFFECTIVE} 分（step ${STEP_TIMEOUT} 分；依據：${BASIS}）"

      # Step 2.7 — heavy-verify 前置檢查（B6，34735315950 事故修正）。
      #
      # 事故的可行性風險出現在**很晚**才被發現：agent 花了 50 分鐘反覆調整模型，
      # 只為讓 Apalache 在 10 分鐘內跑完。這種「可行性質疑」應該在花成本前就揭露。
      #
      # 本步驟是**零成本、advisory** 的前置檢查（不擋 run）：對 heavy-verify 任務
      # 檢查目標 repo 是否已具備規格工具鏈（quint 依賴／specs/ 目錄／Java）。
      # 缺一項就發 warning 到 run log——讓人類在 agent 燒牆鐘前有機會決定：
      # 先開 spike 單、降界、或改 model_tier 覆寫。
      #
      # 誠實揭露：這不是完整可行性證明（真正的成本量測必須實際跑一次模型檢查）。
      # 完整 spike 需在機制 repo 建 probe CLI＋Apalache 二進位，列為後續工作項。
      - name: Preflight heavy-verify feasibility (advisory)
        id: heavy-preflight
        if: steps.model.outcome == 'success'
        env:
          MODEL_JSON: ${{ github.workspace }}/.factory/model.json
        run: |
          TIER=$(jq -r '.tier // "high"' "$MODEL_JSON" 2>/dev/null || echo high)
          ESCALATION=$(jq -r '.escalation // empty' "$MODEL_JSON" 2>/dev/null || true)
          if [ "$ESCALATION" != "heavy-verify" ]; then
            echo "not heavy-verify (tier=$TIER); preflight skipped"
            echo "heavy_verify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "heavy_verify=true" >> "$GITHUB_OUTPUT"
          echo "::notice::heavy-verify 任務：模型已升 critical、agent 逾時預算 110 分（A1）"
          MISSING=""
          if [ -d target/specs ]; then
            echo "preflight: target/specs/ 已存在（$(find target/specs -name '*.qnt' | wc -l | tr -d ' ') 個 .qnt）"
          else
            echo "preflight: target/specs/ 不存在——agent 需從零建立規格樹"
            MISSING="$MISSING specs-dir"
          fi
          if jq -e '.devDependencies["@informalsystems/quint"] // .dependencies["@informalsystems/quint"]' \
              target/package.json >/dev/null 2>&1; then
            echo "preflight: @informalsystems/quint 已宣告於目標 repo"
          else
            echo "preflight: @informalsystems/quint 未宣告——模型檢查工具鏈需由 agent 取得"
            MISSING="$MISSING quint-dep"
          fi
          if [ -n "$MISSING" ]; then
            echo "::warning::heavy-verify 前置缺口:${MISSING}。可行性風險請於 Issue 留言確認——考慮先開 spike 單量測單次 verify 牆鐘，或於 dispatch 時以 agent_timeout_minutes 覆寫預算。"
            echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          fi

      # Step 3 — 執行 agent（DSH headless，受限沙箱；或 dry-run stub）。
      # agent 的工作目錄 = target/（目標 repo）；機制（node_modules/dist/config）
      # 在根目錄以絕對路徑引用。
      - name: Install gh stack extension
        if: inputs.dry_run != true
        env:
          # 認證安裝：未認證的 gh extension install 會打爆 GitHub API rate limit
          #（2026-08-18 實測：4 個平行 run 觸發 403）。冪等：已安裝則跳過。
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          if gh extension list | grep -q "github/gh-stack"; then
            echo "gh-stack already installed"
          else
            gh extension install github/gh-stack --pin v0.1.0
          fi
          gh stack --version

      - name: Run factory agent
        id: agent
        if: success()
        # step 級逾時動態化（A1）。原本硬編碼 50 分：heavy-verify 任務必然逾時，
        # 且逾時 = process 被砍、agent 來不及寫 report（34735315950 實證）。
        timeout-minutes: ${{ fromJSON(steps.agent-timeout.outputs.step_timeout_minutes) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # 多 provider 金鑰：全部以 env 傳入（DSH 在 sandbox 外讀取），
          # 由 model_provider 選擇使用哪一個；未設定的會 MISSING_CREDENTIAL。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          TASK_TYPE: ${{ steps.tasktype.outputs.value }}
          # git 身分以 env 固定：env 優先於 git config，agent 改寫 user.name/email
          # 也蓋不掉（曾自創 factory-agent，被 GitHub 歸屬到同名陌生帳號）。
          # DSH 只 scrub /KEY|PASSWORD|SECRET|TOKEN/i 與 DSH_*，這四個會傳進 agent。
          GIT_AUTHOR_NAME: softwarefactory-bot[bot]
          GIT_AUTHOR_EMAIL: softwarefactory-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: softwarefactory-bot[bot]
          GIT_COMMITTER_EMAIL: softwarefactory-bot[bot]@users.noreply.github.com
        run: |
          set +e
          # agent 牆鐘（ADR-019 R10：PBT 稽核留言的「機制實測」）。寫 GITHUB_ENV 而非
          # report.json：report 由 agent 自己寫，受測者填寫的量測值沒有意義。
          echo "AGENT_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            # agent 一律在目標 repo checkout 內工作（sandbox workspaceRoot = cwd）
            cd target
            node "$GITHUB_WORKSPACE/dist/cli/dry-run-agent.js" \
              "${{ inputs.dry_run_scenario }}" "${{ inputs.issue_number }}" \
              > .factory/run/dry.txt 2>&1
            code=0
          else
            # dsh 已為 devDependency（Install and build 的 pnpm install 已安裝，lockfile 鎖定）
            # 再進入目標 repo 工作目錄（其餘路徑以 $GITHUB_WORKSPACE 絕對引用）
            cd target
            mkdir -p "$HOME/.dsh"
            # 共享 skills root（ADR-012）：factory skills 單一事實來源在機制 repo，
            # 目標 repo 不再複製 .dsh/skills（DRIFT-ELIMINATION）——同步到
            # $HOME/.dsh/skills（DSH rank 400 user-dsh）供 agent 載入。
            mkdir -p "$HOME/.dsh/skills"
            # 類型專屬技能（ADR-019 R7）：skills-lock.json 標了 onlyFor 的技能只複製給
            # 列出的類型。不能整包 cp：DSH 依 description 自動載入，而 `hegel` 的
            # description 會在「write tests / add test coverage」時觸發——正是
            # add-tests、fix-bug 每張工單的內容。Quint 靠 description 窄而沒有外溢，
            # Hegel 沒有這個條件，且原封不動 vendor 不能改 description。
            # 名單取不到時 fail closed（set +e 下需顯式 exit）：寧可不跑，也不要
            # 在篩選失效的情況下讓 agent 拿到不該拿的 SOP。
            SKILLS_EXCLUDED_JSON=$(node "$GITHUB_WORKSPACE/dist/cli/factory-skills-lock.js" \
              --excluded-for "$TASK_TYPE" \
              --lock "$GITHUB_WORKSPACE/config/factory/skills-lock.json")
            EXCLUDED_RC=$?
            SKILLS_EXCLUDED=$(printf '%s' "$SKILLS_EXCLUDED_JSON" | jq -er 'if (.excluded | type) == "array" then .excluded[] else error("excluded 欄位缺失") end')
            JQ_RC=$?
            # jq -e：空名單時 exit 4（沒有輸出）；非 JSON 或缺 excluded 欄位時 exit 5——只有後者算失敗。
            if [ "$EXCLUDED_RC" -ne 0 ] || { [ "$JQ_RC" -ne 0 ] && [ "$JQ_RC" -ne 4 ]; }; then
              echo "::error::無法取得類型專屬技能名單（factory-skills-lock --excluded-for 失敗）"
              exit 1
            fi
            for SKILL_DIR in "$GITHUB_WORKSPACE"/.dsh/skills/*/; do
              SKILL_NAME=$(basename "$SKILL_DIR")
              if printf '%s\n' "$SKILLS_EXCLUDED" | grep -qxF "$SKILL_NAME"; then
                echo "skill skipped for ${TASK_TYPE}: ${SKILL_NAME}"
                continue
              fi
              mkdir -p "$HOME/.dsh/skills/$SKILL_NAME"
              cp -r "$SKILL_DIR". "$HOME/.dsh/skills/$SKILL_NAME/"
            done
            echo "skills synced: $(ls "$HOME/.dsh/skills" | tr '\n' ' ')"
            # 技能傳輸完整性校驗（E5／ADR-016 §5）：上面的 cp 若不完整，agent 會
            # 安靜地在缺少 factory-stop-rules 的情況下執行。CLI 恆 exit 0（第一階段
            # 僅警告不擋 run，Q16-2 待人類裁決是否升紅燈），故此處不需 || true。
            SKILLS_LOCK_OUT=$(node "$GITHUB_WORKSPACE/dist/cli/factory-skills-lock.js" \
              --verify \
              --task-type "$TASK_TYPE" \
              --lock "$GITHUB_WORKSPACE/config/factory/skills-lock.json" \
              --skills-dir "$HOME/.dsh/skills")
            echo "$SKILLS_LOCK_OUT"
            if [ "$(printf '%s' "$SKILLS_LOCK_OUT" | jq -r .ok)" != "true" ]; then
              echo "::warning::skills-lock 校驗未通過——技能可能未完整送達 agent（詳見上方 mismatches）"
            fi
            # 內容政策：已生效技能釘死具體 model id（ADR-011、docs/25 §4.2 第 7 項）。
            # 與 .ok 刻意分開判讀，因為兩者的處置不同：ok 為 false 要重新同步技能，
            # 這裡非空則要改 SKILL.md 的措辭。合成一個布林就分不出該做哪一件事。
            #
            # 為何已生效的技能也要查：promote 閘門只擋新提案，既有技能與人類手改
            # 都繞過它；而 model id 退役時不會讓任何東西變紅（SKILL.md 仍在、hash
            # 仍相符、ok 仍為 true），它只會安靜地繼續指導 agent。
            SKILLS_PINS=$(printf '%s' "$SKILLS_LOCK_OUT" \
              | jq -r '[.modelPins[]? | "\(.name)=\(.ids | join(","))"] | join("; ")')
            if [ -n "$SKILLS_PINS" ]; then
              # ${...} 大括號為必要，不是風格：全形右括號 `）` 緊接裸 $VAR 時，
              # bash 3.2（macOS 預設）會把它的高位位元組吃進變數名，展開成未設定的
              # 變數——warning 仍會印出，但**唯一有用的資訊（哪個技能、哪個 id）消失**。
              # 實測：`（$P）` → `（��`；`（${P}）` → 正常。
              echo "::warning::skills 內含具體 model id（${SKILLS_PINS}）——模型選擇的單一事實來源是 config/dsh/model-tiers.yaml，請改為指稱 tier"
            fi
            # skills_digest 接線（Q26-1／Q25-6）：本次 run **實際載入**的技能集合
            # 版本，送進 Scoreboard 事件，讓 docs/25 §5 第 4 步「放行前後比對」
            # 從做不到變成做得到。
            #
            # 值取自 --verify 的 digest，而不是 skills-lock.json 的 hash：兩者只在
            # 「cp -r 不完整」時不同，而那正是唯一重要的情況——記下 lock 的 hash
            # 會讓看板顯示一個 agent 從未載入過的版本。
            #
            # 寫進 GITHUB_ENV 而非 report.json：report.json 由 agent 自己寫，能被
            # 受測者填寫的量測值沒有意義（factory-push-event 因此不再讀該欄位）。
            SKILLS_DIGEST=$(printf '%s' "$SKILLS_LOCK_OUT" | jq -r '.digest // ""')
            echo "SKILLS_DIGEST=${SKILLS_DIGEST}" >> "$GITHUB_ENV"
            echo "skills digest: ${SKILLS_DIGEST:-<none>}"
            # 模型 tier 路由（ADR-011）：chain 來自「Select model tier」步驟的
            # model.json（primary + fallback）。每項重寫 agent-default-model 後跑 dsh；
            # provider 層失敗（429/credential/UNKNOWN_MODEL）沿 chain fallback。
            #
            # A4（34735315950 事故修正）：每次嘗試以 `timeout(1)` 包住，並在此層
            # **具名**逾時（`agent-inner-timeout`）。原本的失敗模式是整條 step 被
            # runner 砍掉：agent 沒有機會寫 report，止原因在資料層是 null。
            # 內層逾時的兩個好處：(1) 止原因可歸因到單一 provider；(2) 逾時後
            # 仍有時間把 report 寫完，judge/scoreboard 拿得到訊號。
            #
            # 逾時與 chain：每次嘗試的時限＝**全部剩餘預算**（ATTEMPT_TIMEOUT=REMAINING_SEC），
            # 所以真的逾時（124）必然把預算耗盡，實際行為是「停止、交還人類」，不會換
            # 下一項（#337 報告 F1；原註解宣稱「逾時沿 chain 升級」，與實際不符）。
            # 逾時分支的 `continue` 只在預算未耗盡前收到 137（外部 SIGKILL／OOM）時才會走到。
            # 每項嘗試前另檢查剩餘預算：用盡就不再啟動，否則 `timeout 0` 等於不設內層
            # 時限（F2），又回到 step 被砍、report 來不及寫的 A4 失敗模式。
            BUDGET_MIN="${{ steps.agent-timeout.outputs.effective_minutes }}"
            TIER=$(jq -r '.tier // ""' "$GITHUB_WORKSPACE/.factory/model.json")
            REMAINING_SEC=$((BUDGET_MIN * 60))
            ATTEMPT=0
            TIMED_OUT=false
            STOP_REASON=""
            LAST_PROVIDER=""
            while IFS= read -r ENTRY; do
              [ -z "$ENTRY" ] && continue
              P=$(printf '%s' "$ENTRY" | jq -r .provider)
              MODEL=$(printf '%s' "$ENTRY" | jq -r .model)
              EFFORT=$(printf '%s' "$ENTRY" | jq -r '.reasoningEffort // empty')
              if [ "$REMAINING_SEC" -le 0 ]; then
                echo "::warning::逾時預算已用盡，不啟動 chain 下一項（${P}/${MODEL}）"
                break
              fi
              # DSH 0.1.7 移除了 $HOME/.dsh/settings.yaml（只在啟動後非同步匯入一次，
              # headless 來不及生效）：2026-09-24 升級後所有 run 都落回內建的
              # deepseek-official。改以 Cordis patch 覆寫 agent-default-model 與
              # llm-pi-ai，並用 --patch 帶入（見 src/model-tier/dsh-patch.ts）。
              node "$GITHUB_WORKSPACE/dist/cli/factory-dsh-patch.js" \
                --provider "$P" --model "$MODEL" ${EFFORT:+--effort "$EFFORT"} \
                --providers "$GITHUB_WORKSPACE/config/dsh/settings.providers.yaml" \
                --out "$GITHUB_WORKSPACE/.factory/model.patch.yml" > /dev/null
              # 供 Measure usage 比對「要求 vs 實際」route（防路由再次無聲失效）
              echo "$P/$MODEL" >> "$GITHUB_WORKSPACE/.factory/attempted-routes.txt"
              ATTEMPT=$((ATTEMPT + 1))
              LAST_PROVIDER="$P"
              echo "trying model routing: $P/$MODEL${EFFORT:+ (effort=$EFFORT)} (attempt=$ATTEMPT, remaining=${REMAINING_SEC}s)"
              # 依 task_type 選模板（優先目標 repo 的模板，fallback 到機制 repo）
              # 檔名慣例為 task-template-<type>.txt（type 無 agent- 前綴，
              # docs/09 §3 2.1）；TASK_TYPE 帶 agent- 前綴，故剝除後再拼檔名。
              TEMPLATE=".github/factory/task-template-${TASK_TYPE#agent-}.txt"
              [ -f "$TEMPLATE" ] || TEMPLATE="$GITHUB_WORKSPACE/.github/factory/task-template-${TASK_TYPE#agent-}.txt"
              if [ ! -f "$TEMPLATE" ]; then
                # 每種 task_type 應各有專屬模板（factory-assets 對抗性測試釘住）；
                # 走到這裡表示漂移（缺檔或新增 task_type 未建檔）——fail-loud：
                # 警告不可靜默，讓維護者看到降級。
                echo "::warning::No dedicated task-template for task_type=${TASK_TYPE}; falling back to generic task-template.txt"
                TEMPLATE="$GITHUB_WORKSPACE/.github/factory/task-template.txt"
              fi
              echo "task template: $TEMPLATE"
              # 單次嘗試上限：剩餘預算與（首次）總預算的較小值。逾時訊號先 TERM
              # （讓 DSH flush session log 與 stdout），30 秒後才 KILL——DSH headless
              # 在收到 TERM 時仍有機會完成 flush（usage 量測依賴 session log）。
              ATTEMPT_TIMEOUT="$REMAINING_SEC"
              STARTED_AT=$(date +%s)
              timeout --signal=TERM --kill-after=30s "$ATTEMPT_TIMEOUT" \
                "$GITHUB_WORKSPACE/node_modules/.bin/dsh" --profile headless \
                --patch "$GITHUB_WORKSPACE/config/dsh/factory-guardrail.patch.yml" \
                --patch "$GITHUB_WORKSPACE/.factory/model.patch.yml" \
                "$(sed -e "s/<ISSUE>/${{ inputs.issue_number }}/" \
                        -e "s|<REPO>|${{ inputs.repo }}|" \
                        -e "s|<BASE_BRANCH>|${{ inputs.base_branch }}|" \
                        -e "s|<SPEC_PHASE>|${{ steps.specphase.outputs.phase }}|g" \
                        -e "s|<SPEC_NAME>|${{ steps.specphase.outputs.spec_name }}|g" "$TEMPLATE")" \
                > .factory/run/stdout.txt 2> .factory/run/stderr.txt
              code=$?
              ELAPSED=$(( $(date +%s) - STARTED_AT ))
              REMAINING_SEC=$((REMAINING_SEC - ELAPSED))
              [ "$REMAINING_SEC" -lt 0 ] && REMAINING_SEC=0
              echo "provider=$P exit=$code elapsed=${ELAPSED}s remaining=${REMAINING_SEC}s"
              # 每次嘗試的輸出另存一份（隨 run artifact 上傳）：下一次嘗試會覆寫
              # stdout.txt/stderr.txt，run 36838600120 的 Opus 5.5 失敗原因就是這樣遺失的。
              cp .factory/run/stdout.txt ".factory/run/attempt-${ATTEMPT}.stdout.txt"
              cp .factory/run/stderr.txt ".factory/run/attempt-${ATTEMPT}.stderr.txt"
              if [ "$code" -eq 0 ]; then break; fi
              if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
                # 124 = timeout 到期；137 = TERM 未生效被 KILL。兩者都是逾時。
                TIMED_OUT=true
                STOP_REASON="agent-inner-timeout"
                echo "::warning::provider=$P 在 ${ELAPSED}s 後逾時（inner timeout；A4）"
                if [ "$REMAINING_SEC" -le 0 ]; then
                  echo "::warning::逾時預算已用盡，不再升級 chain"
                  break
                fi
                # 逾時視為需要更強模型的訊號 → 沿 chain 升級（相對 provider 層 fallback）。
                echo "escalating to next chain entry after timeout"
                continue
              fi
              # 失敗分類交給 factory-attempt-classify（src/model-tier/attempt-outcome.ts）：
              # 只看 DSH 的終止錯誤行 `dsh: <CODE>: <message>`，不掃整份 stderr——stderr
              # 也是 agent 的 reasoning 串流，run 36838600120 就因 reasoning 的「auth」
              # 把 Opus 5.5 拒答誤判成 provider-error。
              #   - provider-error（RATE_LIMIT/AUTH/401/MISSING_CREDENTIAL/UNKNOWN_MODEL…）→ 沿 chain fallback
              #     （2026-08-28 #171 實測：qwen key 401 應 fallback 而非直接 needs-human）。
              #   - model-refusal（只限 critical；2026-09-27 用戶裁決：Opus 5.5 拒答時改用 Opus 5）
              #     → 沿 chain fallback。已知拒答措辭有四種：新版 stop_details.explanation
              #     （如 `This request was declined because it could enable cyber harm.`）、
              #     `...blocked under Anthropic's Usage Policy.`、
              #     `...blocked as it seems to violate Anthropic's Terms of Service ...`、pi-ai 預設的
              #     `The model refused to complete the request`（比對規則見 attempt-outcome.ts）。
              #   - agent-error（任務層失敗）→ 不重試（docs/02 §6）。
              CLASSIFY=$(node "$GITHUB_WORKSPACE/dist/cli/factory-attempt-classify.js" \
                --stderr .factory/run/stderr.txt --tier "${TIER:-unknown}" < /dev/null) \
                || CLASSIFY='{"outcome":"agent-error","fallback":false}'
              STOP_REASON=$(printf '%s' "$CLASSIFY" | jq -r '.outcome')
              ERROR_LINE=$(printf '%s' "$CLASSIFY" | jq -r '.errorLine // "(stderr 沒有 dsh 錯誤行)"')
              echo "::warning::provider=${P}/${MODEL} 失敗（${STOP_REASON}）：${ERROR_LINE}"
              if [ "$(printf '%s' "$CLASSIFY" | jq -r '.fallback')" = "true" ]; then
                continue
              fi
              break
            done < <(jq -c '.chain[]' "$GITHUB_WORKSPACE/.factory/model.json")
            # exit 0 代表成功：成功路徑不該帶任何止原因（agent 應已自寫 report，
            # 這裡只在它漏寫時補一份乾淨的）。
            if [ "$code" -eq 0 ]; then STOP_REASON=""; fi
            [ -z "$STOP_REASON" ] && [ "$code" -ne 0 ] && STOP_REASON="agent-error"
            echo "inner_timeout=$TIMED_OUT attempts=$ATTEMPT stop_reason=${STOP_REASON:-none}" >> "$GITHUB_OUTPUT"
          fi
          set -e
          echo "AGENT_END_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # fallback：agent 未寫 report 時依 exit code 補最小 report（cwd=target）。
          # A2：帶上決定性的止原因與 chain 歸因，讓 judge/scoreboard 不必從 log 猜。
          # dry_run 走 stub agent，不套用真實 run 的止原因語意（避免偽造歸因）。
          REPORT_ARGS=()
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            if [ -n "${STOP_REASON:-}" ]; then
              REPORT_ARGS+=(--stop-reason "$STOP_REASON")
            fi
            if [ -n "${LAST_PROVIDER:-}" ]; then
              REPORT_ARGS+=(--provider "$LAST_PROVIDER")
            fi
            if [ "${ATTEMPT:-0}" -gt 0 ]; then
              REPORT_ARGS+=(--attempts "$ATTEMPT")
            fi
            if [ "${TIMED_OUT:-false}" = "true" ]; then
              REPORT_ARGS+=(--timed-out)
            fi
          fi
          node "$GITHUB_WORKSPACE/dist/cli/write-report.js" \
            "${{ inputs.issue_number }}" "$code" \
            .factory/run/stdout.txt .factory/run/stderr.txt "${REPORT_ARGS[@]}"

      # Step 3.5 — 量測 token 用量與成本（docs/04 §5、docs/08 §2.3）。
      # 真實 run 才有 DSH session log；dry_run 由 stub 產固定 usage（同路徑）。
      # 量測是「附註」不是 gate：session log 找不到時 factory-usage exit 0 且
      # unavailableReason 非空，留言照貼但不偽造數字；此步驟失敗不擋 run。
      # agent 失敗（exit≠0）通常仍已 flush session（headless 在 exit 前 flush），
      # 故 failure 也量（逾時被 kill 例外，log 缺失時自然回 unavailable）。
      - name: Measure usage & cost
        if: always() && steps.agent.outcome != 'skipped' && inputs.dry_run != true
        continue-on-error: true
        env:
          # B8：token budget 的可觀察性。judge 已讀 TOKEN_BUDGET 觸發 SR7 停手規則
          # （src/stop-rules/stop-rules.ts），但在此之前 `token_budget` 預設 0＝
          # 裝置形同不存在：34735315950 燒掉 19.4M token（USD $0.306）而 run 內
          # 沒有任何一處顯示「這逼近了什麼」。此處把預算與實測並列，讓留言自帶校準依據。
          TOKEN_BUDGET: ${{ inputs.token_budget }}
        run: |
          node "$GITHUB_WORKSPACE/dist/cli/factory-usage.js" \
            --sessions-root "$HOME/.dsh/sessions" \
            --pricing "$GITHUB_WORKSPACE/config/dsh/pricing.yaml" \
            --usage-md "$GITHUB_WORKSPACE/target/.factory/run/usage.md" \
            --report "$GITHUB_WORKSPACE/target/.factory/run/report.json" \
            > "$GITHUB_WORKSPACE/target/.factory/run/usage.json" \
            || echo "::warning::usage 量測失敗（不擋 run；Issue 留言將不含用量段落）"
          ls -la target/.factory/run/usage.md 2>/dev/null || true
          # 路由比對：session log 的實際 route 必須都在本次嘗試過的 route 之內。
          # 2026-09-24～27 DSH 0.1.7 忽略工廠設定，全部 run 落到內建 deepseek-official，
          # 而沒有任何一處提示——不符時標 ::error 並寫進 Issue 留言的用量段落。
          ACTUAL=$(jq -r '[.usage.routes[]? | "\(.provider)/\(.model)"] | unique | .[]' \
            "$GITHUB_WORKSPACE/target/.factory/run/usage.json" 2>/dev/null || true)
          MISMATCH=""
          for R in $ACTUAL; do
            grep -qxF "$R" "$GITHUB_WORKSPACE/.factory/attempted-routes.txt" 2>/dev/null || MISMATCH="$MISMATCH $R"
          done
          if [ -n "$MISMATCH" ]; then
            REQUESTED=$(paste -sd, "$GITHUB_WORKSPACE/.factory/attempted-routes.txt" 2>/dev/null || echo "（無紀錄）")
            echo "::error::模型路由不符：要求 $REQUESTED，實際${MISMATCH}"
            printf '\n> ⚠️ **模型路由不符**：要求 `%s`，實際 `%s`——DSH 未採用工廠的模型設定，請檢查路由。\n' \
              "$REQUESTED" "${MISMATCH# }" >> "$GITHUB_WORKSPACE/target/.factory/run/usage.md"
          else
            echo "model routing verified: ${ACTUAL:-（無 route 紀錄）}"
          fi
          # B8：預算 vs 實測並列。逾時 run 的 per-run 觀測值是校準 token_budget
          # 唯一的來源（Q02-5），故即使量測失敗也印出預算設定。
          BUDGET="${TOKEN_BUDGET:-0}"
          OBSERVED=$(jq -r '.usage.totals.totalTokens // empty' \
            "$GITHUB_WORKSPACE/target/.factory/run/usage.json" 2>/dev/null || true)
          if [ -z "$OBSERVED" ]; then
            echo "::notice::token budget=$BUDGET（本次量測不可用；逾時 run 常無 session log）"
          elif [ "$BUDGET" -gt 0 ] && [ "$OBSERVED" -gt "$BUDGET" ]; then
            echo "::warning::token 用量 $OBSERVED 已超過單一工作項上限 $BUDGET（SR7 停手規則將觸發；請於 judge 留言確認）"
          else
            echo "::notice::token budget=$BUDGET，本次實測 $OBSERVED"
          fi

      # Step 4 — 交叉驗證（G3，docs/18 §2.3）：把 agent 自報的 report.json 與目標
      # repo 的實際 git diff 比對。report 是 agent 自報（不可信），judge 只驗形狀；
      # mismatch（假完成 / 隱藏變更 / 行數缺失）在此 fail-loud → 貼 needs-human，
      # 並擋下後續 judge（避免在錯誤輸入上做出看似正常的終點判定）。
      - name: Cross-check report vs git diff
        id: crosscheck
        if: steps.agent.outcome == 'success' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          set +e
          ANALYZE_FLAG=""
          if [ "${{ steps.tasktype.outputs.value }}" = "agent-analyze" ]; then
            # analyze 模式：crosscheck 驗證「僅分析不實作」（非 docs/ 變更 → fail-loud）
            ANALYZE_FLAG="--analyze-only"
          elif [ "${{ steps.tasktype.outputs.value }}" = "agent-propose-skill" ]; then
            # propose-skill 模式（E6／ADR-016 §3 閘門 1）：只允許 proposals/skills/ 與
            # docs/；任何 .dsh/、src/、.github/ 變更 → fail-loud → needs-human。
            # 兩個旗標互斥（CLI 會拒絕同時指定），故此處用 elif 而非各自獨立判斷。
            ANALYZE_FLAG="--propose-skill-only"
          elif [ "${{ steps.tasktype.outputs.value }}" = "agent-write-spec" ]; then
            # write-spec（ADR-018 §9 護欄①、§12）：階段白名單、source.md 快照、關閉關鍵字。
            # crosscheck 只讀本地資料：本工作項各 factory PR 的描述在此以 gh 取得、寫檔傳入。
            gh pr list --state open --limit 200 --json headRefName,body \
              | jq --arg i "${{ inputs.issue_number }}" \
                  '[.[] | select((.headRefName | startswith("factory/" + $i + "-")) or (.headRefName | startswith("factory/" + $i + "/"))) | .body]' \
              > .factory/pr-bodies.json
            ANALYZE_FLAG="--write-spec-phase ${{ steps.specphase.outputs.phase }} --spec-name ${{ steps.specphase.outputs.spec_name }} --pr-bodies .factory/pr-bodies.json"
            if [ "${{ steps.specphase.outputs.phase }}" = "invariants" ]; then
              ANALYZE_FLAG="$ANALYZE_FLAG --source-snapshot .factory/spec-source-snapshot.md"
            fi
          elif [ "${{ steps.tasktype.outputs.value }}" = "agent-pbt-audit" ]; then
            # pbt-audit（ADR-019 §5、R6）：只允許新增或修改 PBT 測試檔、不得刪除。
            # 這是 in-loop 豁免的前提之一（apply-score-labels.ts IN_LOOP_ALLOWED_TASK_TYPES）。
            # 其他類型不帶旗標時，crosscheck 反過來檢查「不得產出 PBT 檔」。
            ANALYZE_FLAG="--pbt-audit-only"
          fi
          # REQ id 錨定（RTM）：由 Issue body 的驗收條目重建 REQ-n 清單，交給
          # crosscheck 比對 report.requirements[].id。**advisory**——對不上不擋 run
          # （第一階段觀察落差率，避免自由文字解析的假陽性擋住工廠）。
          ANCHOR_FLAG=""
          if ISSUE_BODY=$(gh issue view "${{ inputs.issue_number }}" --json body -q .body 2>/dev/null); then
            N=$(printf '%s' "$ISSUE_BODY" | awk '
              /^### 驗收標準/ { inDod=1; next }
              /^### / { inDod=0 }
              inDod && /^[-*] / {
                line=$0
                sub(/^[-*] +(\[[ xX]\] *)?/, "", line)
                if (line ~ /有可驗證的測試\/驗證方式/) next
                if (line ~ /不觸碰高風險路徑/) next
                if (line ~ /跑測試確認綠燈/) next
                if (line != "") c++
              }
              END { print c+0 }')
            if [ "$N" -gt 0 ]; then
              ANCHORS=$(seq 1 "$N" | sed 's/^/REQ-/' | paste -sd, -)
              ANCHOR_FLAG="--requirement-anchors $ANCHORS"
            fi
          fi
          node "$GITHUB_WORKSPACE/dist/cli/factory-crosscheck.js" \
            "${{ inputs.issue_number }}" \
            target/.factory/run/report.json \
            --base "${{ inputs.base_branch }}" --target target $ANALYZE_FLAG $ANCHOR_FLAG \
            > .factory/crosscheck.json 2> .factory/crosscheck.err
          code=$?
          set -e
          cat .factory/crosscheck.json
          # crosscheck 本身失敗（例如 report.json 不符 schema）時只寫 stderr、不寫 JSON。
          # 原因必須同時進 log 與留言（philipz/fubon-tradingbot#670：原因只在沒人看得到的
          # crosscheck.err，人只能下載 artifact 在本機重跑才查到）。
          # 判斷「有沒有 JSON」要用 jq -e：jq 讀空檔 exit 0 且不輸出，`jq ... || echo 0`
          # 因此得到空字串而非 0（同一事故的 `integer expression expected`）。
          HAS_JSON=false
          jq -e 'type == "object"' .factory/crosscheck.json >/dev/null 2>&1 && HAS_JSON=true
          if [ "$HAS_JSON" != true ] && [ -s .factory/crosscheck.err ]; then
            echo "::error::factory-crosscheck 未產出 JSON：$(head -n 1 .factory/crosscheck.err | head -c 500 | iconv -f UTF-8 -t UTF-8 -c)"
            cat .factory/crosscheck.err
          fi
          # advisory 單獨提示（不影響 code，不擋 run）
          ADVISORY_COUNT=0
          if [ "$HAS_JSON" = true ]; then
            ADVISORY_COUNT=$(jq -r '(.advisories // []) | length' .factory/crosscheck.json)
          fi
          if [ "$ADVISORY_COUNT" -gt 0 ]; then
            echo "::warning::REQ id 錨定 advisory（不擋 run）：$(jq -r '[.advisories[].kind] | join(", ")' .factory/crosscheck.json)"
          fi
          if [ "$code" -ne 0 ]; then
            # 標題由 crosscheck 依 mismatch 類別產出（scope＝變更超出任務類型範圍、
            # consistency＝report 與實際不一致）；舊版輸出缺 headline 時退回原標題，
            # crosscheck 本身失敗（沒有 JSON）時明講，不再一律稱為「不一致」。
            if [ "$HAS_JSON" = true ]; then
              HEADLINE=$(jq -r '.headline // "" | if . == "" then "report 與實際變更不一致" else . end' .factory/crosscheck.json)
            else
              HEADLINE="crosscheck 執行失敗"
            fi
            echo "::error::${HEADLINE}（詳見 .factory/crosscheck.json）"
            {
              echo "## 工廠執行中止：${HEADLINE}"
              echo ""
              echo "（run: ${{ github.run_id }}）"
              echo ""
              if [ "$HAS_JSON" = true ]; then
                jq -r '[(.mismatches // [])[] | "- \(.kind)：\(.detail)"] | join("\n")' .factory/crosscheck.json
              else
                echo "factory-crosscheck 未產出 JSON（沒有 mismatch 明細），錯誤輸出如下："
                echo ""
                echo '```'
                if [ -s .factory/crosscheck.err ]; then
                  # 留言上限 65536 字元；原因在開頭幾行，截斷不損失診斷資訊。
                  # 以位元組截斷可能切開多位元組字元，iconv -c 丟掉殘缺的尾端；丟棄時
                  # iconv 以 1 結束，`|| true` 避免 set -e 在貼留言前中止 step。
                  head -c 4000 .factory/crosscheck.err | iconv -f UTF-8 -t UTF-8 -c || true
                  echo ""
                else
                  echo "（stderr 為空；請查看 run logs）"
                fi
                echo '```'
              fi
              if [ -f target/.factory/run/usage.md ]; then
                echo ""
                cat target/.factory/run/usage.md
              fi
            } > .factory/crosscheck-comment.txt
            gh issue comment "${{ inputs.issue_number }}" --body-file .factory/crosscheck-comment.txt
            gh issue edit "${{ inputs.issue_number }}" --add-label needs-human
          fi
          exit $code

      # ADR-018 §7：write-spec 的集中驗證——結果由 CI 計算，不採信 agent 自報。
      # 不變量階段：typecheck＋每個 INV_* 都有 `// source:`；模型階段：依 verify.yml
      # 逐項跑 quint run／verify，違反的反例 ITF 由 CI 寫回分支的 traces/（CI 專屬目錄）。
      # 違反是「候選發現（未回放）」不是失敗；證據不完整（錯誤、假綠燈、清單不合法）才
      # 交還人類。放在 crosscheck 之後（agent 的變更範圍已驗證）、judge 之前。
      - name: Verify write-spec artifacts (ADR-018 §7)
        id: specverify
        if: steps.specphase.outputs.phase != '' && steps.crosscheck.outcome == 'success'
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          set +e
          PHASE="${{ steps.specphase.outputs.phase }}"
          SPEC="${{ steps.specphase.outputs.spec_name }}"
          ISSUE="${{ inputs.issue_number }}"
          BRANCH=$(git -C target for-each-ref --format='%(refname:short)' \
            "refs/heads/factory/${ISSUE}-*" "refs/heads/factory/${ISSUE}/*" | tail -1)
          if [ -z "$BRANCH" ]; then
            echo "::error::找不到 factory/${ISSUE} 分支，無法驗證規格產出"
            exit 1
          fi
          git -C target checkout -q "$BRANCH"
          node dist/cli/factory-spec-verify.js --phase "$PHASE" --spec-name "$SPEC" \
            --target target --summary .factory/spec-verify.md > .factory/spec-verify.json
          code=$?
          set -e
          cat .factory/spec-verify.json
          # 反例 ITF 寫回分支，讓它和模型一起審查、供後續 fix-bug 工單引用（Q31）
          if [ "$PHASE" = "model" ] && [ -n "$(git -C target status --porcelain -- "specs/${SPEC}/traces")" ]; then
            git -C target add -A "specs/${SPEC}/traces"
            git -C target commit -q -m "chore(spec): CI 模型檢查反例 ITF（ADR-018 §7，run ${{ github.run_id }}）"
            git -C target -c http.https://github.com/.extraheader= push -q origin "$BRANCH"
          fi
          gh issue comment "$ISSUE" --body-file .factory/spec-verify.md
          if [ "$code" -ne 0 ]; then
            gh issue edit "$ISSUE" --add-label needs-human
            echo "::error::規格驗證證據不完整（詳見 .factory/spec-verify.json）"
            exit 1
          fi

      # Step 5 — 執行後判定：重計分 + 停手規則（重用 runWorkItem 管線）。
      # report.json 在 target/.factory/run/（agent cwd=target）；catalog/risk-paths 讀目標 repo。
      # TOKEN_BUDGET 由 input 帶入（0 = 不設限），judge 讀 env（Q02-5 SR7 接線）。
      # crosscheck skipped（dry_run）或成功才放行 judge；crosscheck 失敗時其自身已貼
      # needs-human，judge 不該再基於（可能是假的）report 產出終點。
      - name: Judge terminal state
        id: judge
        if: steps.agent.outcome == 'success' && (steps.crosscheck.outcome == 'success' || steps.crosscheck.outcome == 'skipped') && (steps.specverify.outcome == 'success' || steps.specverify.outcome == 'skipped')
        env:
          TOKEN_BUDGET: ${{ inputs.token_budget }}
        run: |
          # --task-type：write-spec 一律不自動合併（ADR-018 護欄②，計分之後套用）
          node dist/cli/factory-judge.js \
            target/.factory/run/report.json \
            target/catalog-info.yaml \
            target/.github/factory/risk-paths.yml \
            --task-type "${{ steps.tasktype.outputs.value }}" \
            > .factory/judge.json
          cat .factory/judge.json

      # agent 逾時/失敗捕獲：judge 只在 success 跑，逾時會靜默（2026-08-21 實測
      # run #32491052696 逾時後無 needs-human）。此步補最小 report + 留言 + 標籤。
      - name: Handle agent timeout/failure
        if: always() && steps.agent.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          cd target
          node "$GITHUB_WORKSPACE/dist/cli/write-report.js" \
            "${{ inputs.issue_number }}" 1 \
            .factory/run/stdout.txt .factory/run/stderr.txt --timed-out || true
          USAGE_MD=".factory/run/usage.md"
          if [ -f "$USAGE_MD" ]; then
            { echo "⏱️ factory agent 未在時限內完成（逾時或失敗）——已轉交人類接手。請查看 run ${{ github.run_id }} 的 logs。"; cat "$USAGE_MD"; } \
              > .factory/run/handover.md
            gh issue comment "${{ inputs.issue_number }}" --body-file .factory/run/handover.md
          else
            gh issue comment "${{ inputs.issue_number }}" \
              --body "⏱️ factory agent 未在時限內完成（逾時或失敗）——已轉交人類接手。請查看 run ${{ github.run_id }} 的 logs。"
          fi
          gh issue edit "${{ inputs.issue_number }}" --add-label needs-human

      - name: Apply judge labels and comment
        id: apply-labels
        if: steps.agent.outcome == 'success' && (steps.crosscheck.outcome == 'success' || steps.crosscheck.outcome == 'skipped') && (steps.specverify.outcome == 'success' || steps.specverify.outcome == 'skipped')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          # 第三參數 = usage markdown（存在才傳；apply-judge-labels 對缺檔容錯，
          # 量測是附註不是 gate）
          USAGE_ARG=""
          if [ -f target/.factory/run/usage.md ]; then
            USAGE_ARG=" target/.factory/run/usage.md"
          fi
          node dist/cli/apply-judge-labels.js \
            "${{ inputs.issue_number }}" .factory/judge.json${USAGE_ARG}

      # 終態守衛（G1，docs/18 §2.1）——堵住「失敗未進入控制流」的靜默路徑：
      # agent 已啟動但 job 失敗（judge/apply-labels 步驟 crash、gh API 錯誤等）時，
      # 若 Issue 沒有本 run 的終態留言，補貼 needs-human 並留言。
      # 不重複貼的依據：所有終態留言（timeout handler / crosscheck / 本守衛）
      # 都內含 github.run_id；grep 到即代表已有交還紀錄。
      - name: Ensure terminal state (guard)
        if: always() && job.status != 'success' && steps.agent.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          set +e
          COMMENTS=$(gh issue view "${{ inputs.issue_number }}" \
            --json comments --jq '[.comments[].body] | join("\n")' 2>/dev/null)
          set -e
          if printf '%s' "$COMMENTS" | grep -qF "${{ github.run_id }}"; then
            echo "terminal state already posted for run ${{ github.run_id }}; guard idle"
          else
            echo "::warning::run ${{ github.run_id }} 未留下終態留言——補貼 needs-human（G1 終態守衛）"
            mkdir -p .factory
            echo "⚠️ 工廠執行未正常完成（run: ${{ github.run_id }}）——agent 已啟動但未收到終態判定（可能 judge/labels 步驟失敗）。已交還人類，請查看 Actions run logs。" \
              > .factory/guard-comment.txt
            if [ -f target/.factory/run/usage.md ]; then
              { echo ""; cat target/.factory/run/usage.md; } >> .factory/guard-comment.txt
            fi
            # 技能缺口（docs/25 §2.1）：judge/labels 失敗時，這是缺口進入 Issue 的
            # **唯一**路徑。少了它，該筆缺口就只存在於 Scoreboard 與 ~90 天後過期的
            # artifacts——實測 3 筆（run 34731487680、34371349788、34372193923）
            # 正是如此消失的。CLI 恆 exit 0，取不到時寫出空檔，守衛不受影響。
            node dist/cli/factory-skill-gap.js \
              --report target/.factory/run/report.json \
              --out .factory/guard-skill-gap.md \
              || echo "::warning::skill-gap 取出失敗（不擋守衛）"
            if [ -s .factory/guard-skill-gap.md ]; then
              { echo ""; echo "---"; echo ""; cat .factory/guard-skill-gap.md; } >> .factory/guard-comment.txt
            fi
            gh issue comment "${{ inputs.issue_number }}" --body-file .factory/guard-comment.txt
            # 有缺口時一併補上 skill-gap 標籤（聚類用，不影響終態）。兩個標籤同時
            # 指定時若任一不存在，gh 會整條失敗，故退回只貼 needs-human——
            # 守衛的第一要務是「終態不失守」，標籤是附註。
            if [ -s .factory/guard-skill-gap.md ]; then
              gh issue edit "${{ inputs.issue_number }}" --add-label needs-human,skill-gap \
                || gh issue edit "${{ inputs.issue_number }}" --add-label needs-human
            else
              gh issue edit "${{ inputs.issue_number }}" --add-label needs-human
            fi
          fi

      # PBT 稽核摘要（ADR-019 R4、R10）：候選發現與試行指標由**機制**貼到稽核 Issue
      #（agent 不開 Issue、不自己留言）。Issue 留言永久保存，是試行報告的資料來源。
      #
      # 刻意排在 G1 終態守衛**之後**：這則留言內嵌 run id，若排在守衛之前，judge／labels
      # 失敗時守衛會 grep 到它而誤判「已有終態紀錄」，needs-human 就不會被補上。
      # CLI 恆 exit 0（留言是紀錄不是 gate）；AGENT_END_EPOCH 缺席代表 agent 步驟
      # 被砍（逾時），以現在時間代替，讓「卡住」在牆鐘上看得見。
      - name: Post PBT audit summary
        if: always() && steps.tasktype.outputs.value == 'agent-pbt-audit' && steps.agent.outcome != 'skipped' && inputs.dry_run != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          node dist/cli/factory-pbt-audit-comment.js \
            --issue "${{ inputs.issue_number }}" \
            --report target/.factory/run/report.json \
            --target target \
            --base "${{ inputs.base_branch }}" \
            --run-id "${{ github.run_id }}" \
            --agent-start "${AGENT_START_EPOCH:-}" \
            --agent-end "${AGENT_END_EPOCH:-$(date +%s)}" \
            > .factory/pbt-audit-summary.md
          if [ -s .factory/pbt-audit-summary.md ]; then
            gh issue comment "${{ inputs.issue_number }}" --body-file .factory/pbt-audit-summary.md
          else
            echo "::warning::PBT 稽核摘要產生失敗（不擋 run）"
          fi

      # Step 6（人類）— 第 1 期不自動合併；留言告知等待審查
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "run=${{ github.run_id }} repo=${{ inputs.repo }} base=${{ inputs.base_branch }} issue=${{ inputs.issue_number }} dry_run=${{ inputs.dry_run }} job_status=$JOB_STATUS"
          if [ "$JOB_STATUS" = "success" ]; then
            echo "工廠執行完成。第 1 期：所有變更等待人類審查後合併。"
          else
            echo "⚠️ 工廠執行未正常完成（job_status=$JOB_STATUS）——終態以 Issue 上的 needs-human 標籤為準，詳情見 run log。"
          fi

      # Step 6.5 — 推送事件至 Scoreboard（ADR-015、docs/26 §2.2）。
      # 位置在 judge/crosscheck 之後：此時 judge.json 與 crosscheck.json 已產出，
      # 事件才完整。artifacts ~90 天過期，而 skill-gap 的重複可能跨越數月，故需
      # 永久儲存（ADR-015 脈絡）。
      #
      # 收集面永不影響執行面（docs/26 設計原則）：
      #   - continue-on-error: true ＋ CLI 自身永遠 exit 0（雙重保險，同 usage 量測）
      #   - if: always()——失敗與逾時的 run 也要記錄，否則統計只剩成功案例（幸存者偏差）
      #   - 未設定 SCOREBOARD_URL/TOKEN 時 CLI 靜默跳過，不報錯
      #
      # --run-repo：事件的 repo 是目標 repo，run 卻在本（機制）repo 執行。2026-10-03
      # 機制 repo 由 philipz 遷至 aswf-dev 後，看板無法再以單一設定推得 run 連結，
      # 故由事件自述（extra.run_repo，factory-scoreboard#19）。CLI 對未知旗標會報錯，
      # 而本 step continue-on-error——旗標與 CLI 必須同版上線，否則事件靜默遺失。
      - name: Push event to scoreboard
        if: always() && steps.agent.outcome != 'skipped' && inputs.dry_run != true
        continue-on-error: true
        env:
          SCOREBOARD_URL: ${{ vars.SCOREBOARD_URL }}
          SCOREBOARD_TOKEN: ${{ secrets.SCOREBOARD_TOKEN }}
        run: |
          node "$GITHUB_WORKSPACE/dist/cli/factory-push-event.js" \
            --repo "${{ inputs.repo }}" \
            --issue "${{ inputs.issue_number }}" \
            --run-id "${{ github.run_id }}" \
            --task-type "${{ steps.tasktype.outputs.value }}" \
            --report "$GITHUB_WORKSPACE/target/.factory/run/report.json" \
            --judge "$GITHUB_WORKSPACE/.factory/judge.json" \
            --crosscheck "$GITHUB_WORKSPACE/.factory/crosscheck.json" \
            --model "$GITHUB_WORKSPACE/.factory/model.json" \
            --skills-digest "${SKILLS_DIGEST:-}" \
            --run-repo "${{ github.repository }}" \
            > "$GITHUB_WORKSPACE/.factory/scoreboard-event.json" \
            || echo "::warning::scoreboard 推送失敗（不擋 run）"

      # 診斷：agent 的 stdout/stderr/report 上傳成 artifact（失敗也要，否則無從查）
      - name: Upload run artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: factory-run-${{ inputs.issue_number }}-${{ matrix.variant }}
          # gh-token（App installation token，供 agent 讀取）不得進 artifact：artifact
          # 保存 90 天，而 token 只靠 job 結束時的撤銷失效——runner 若在上傳後、撤銷前
          # 中斷，token 會在 artifact 中存活至 1 小時效期結束。
          path: |
            target/.factory/run/
            !target/.factory/run/gh-token
            .factory/model.json
            .factory/issue.json
            .factory/scoreboard-event.json
            .factory/crosscheck.json
            .factory/crosscheck.err
          if-no-files-found: ignore

  compare:
    name: Compare dual models
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Resolve target owner/name
        id: target
        env:
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read

      - name: Download Variant A artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: factory-run-${{ inputs.issue_number }}-a
          path: artifacts/a

      - name: Download Variant B artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: factory-run-${{ inputs.issue_number }}-b
          path: artifacts/b

      - name: Generate comparison report and post comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          # 找出兩個變體的 PR URL（若有的話）
          PR_A=$(gh pr list --repo "$GH_REPO" --head "factory/${{ inputs.issue_number }}-a" --json url --jq '.[0].url // empty' 2>/dev/null || true)
          PR_B=$(gh pr list --repo "$GH_REPO" --head "factory/${{ inputs.issue_number }}-b" --json url --jq '.[0].url // empty' 2>/dev/null || true)

          node dist/cli/factory-compare.js \
            --issue-number "${{ inputs.issue_number }}" \
            ${PR_A:+--pr-url-a "$PR_A"} \
            ${PR_B:+--pr-url-b "$PR_B"} \
            --report-a "artifacts/a/target/.factory/run/report.json" \
            --report-b "artifacts/b/target/.factory/run/report.json" \
            --judge-a "artifacts/a/target/.factory/run/judge.json" \
            --judge-b "artifacts/b/target/.factory/run/judge.json" \
            --usage-a "artifacts/a/target/.factory/run/usage.json" \
            --usage-b "artifacts/b/target/.factory/run/usage.json" \
            --out compare.md

          cat compare.md
          gh issue comment "${{ inputs.issue_number }}" --repo "$GH_REPO" --body-file compare.md

