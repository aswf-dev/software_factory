# Factory Run — 一個工作項的端到端執行（docs/02 §4, docs/04 §4.1）。
#
# 第 1 期範圍（docs/09 §2）：任務類型僅 agent-add-tests；全程人類審查，
# 永不自動合併。dry_run=true 時以 stub agent 取代真實 DSH，用於在沒有
# LLM key 的 CI 上驗證流程接線。
name: Factory Run

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 目標 Issue 編號
        required: true
        type: number
      task_type:
        description: 任務類型（決定 task-template 與 skill 分支）
        required: false
        type: choice
        options: [agent-add-tests, agent-fix-bug, agent-update-deps, agent-write-docs]
        default: agent-add-tests
      repo:
        description: 目標 repo（owner/name）；預設本 repo（docs/09 §2.2）
        required: false
        type: string
        default: philipz/software_factory
      base_branch:
        description: 工廠 trunk 分支（PR 合併目標）。⚠️ 統一規則（ADR-013）：一律 software-factory，不得為 main（Q-P2-1）
        required: false
        type: string
        default: software-factory
      dry_run:
        description: 以 stub agent 取代真實 DSH（驗證流程用）
        required: false
        type: boolean
        default: false
      dry_run_scenario:
        description: dry_run 情境：success | blocked | guardrail
        required: false
        type: choice
        options: [success, blocked, guardrail]
        default: success
      model_tier:
        description: 模型 tier（auto＝依 Issue 複雜度自動選擇；low/medium→qwen3.8-flash、high→deepseek-v4-pro、critical→claude-fable-5，ADR-011）
        required: false
        type: choice
        options: [auto, low, medium, high, critical]
        default: auto
      model_provider:
        description: 模型 provider 偏好（auto＝不偏好；非 auto 時該 provider 置於 chain 前，失敗仍依 chain fallback，Q04-8/ADR-011）
        required: false
        type: choice
        options: [auto, deepseek, qwen, anthropic]
        default: auto
      token_budget:
        description: 單一工作項 token 上限（0 = 不設限，Q02-5 待基線校準後設定實際值）
        required: false
        type: number
        default: 0

concurrency:
  group: factory-${{ inputs.repo }}-${{ inputs.issue_number }}
  cancel-in-progress: false   # 不取消進行中的執行，避免產生半成品（docs/04 §4.3）

permissions:
  # 全部 gh 操作改用 GitHub App token（D6）；GITHUB_TOKEN 僅保留最小讀取。
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 機制 repo（本 repo：workflow/CLI/skill 所在）在根目錄；
      # 目標 repo（inputs.repo）另行 checkout 至 target/，agent 在 target/ 內工作。
      - uses: actions/checkout@v7

      # 安全約束（Q-P2-1 統一，ADR-013）：所有 repo（含機制 repo 自身）的 factory trunk
      # 一律為 software-factory 分支，main 絕不觸碰。Guard 在花費任何成本（token/LLM）
      # 之前就擋下，並在 checkout 前驗證 trunk 分支確實存在（#171 實測教訓）。
      - name: Guard base_branch safety (Q-P2-1 統一)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.base_branch }}" == "main" ]; then
            echo "::error::base_branch 不得為 main（Q-P2-1 統一安全約束：所有 repo 的 main 絕不觸碰，trunk 一律 software-factory）"
            exit 1
          fi
          # 分支存在性檢查：不存在的 trunk 會在 checkout 才炸（#171 實測）；此處零成本 fast-fail
          if ! gh api "repos/${{ inputs.repo }}/git/ref/heads/${{ inputs.base_branch }}" >/dev/null 2>&1; then
            echo "::error::目標 repo ${{ inputs.repo }} 不存在分支 base_branch=${{ inputs.base_branch }}"
            echo "::error::統一規則：所有 repo 的 factory trunk 皆為 software-factory 分支（main 絕不觸碰）"
            exit 1
          fi
          echo "guard ok: repo=${{ inputs.repo }} base_branch=${{ inputs.base_branch }}"

      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
          cache: npm

      # D6：以 GitHub App 身分換發短效 installation token。
      # App 權限最小化（Contents/PRs/Issues RW、Actions/Metadata R），
      # 無 Administration/Workflows —— agent 無法修改 guardrail 自身。
      # repositories 限定目標 repo（最小權限；App 需已安裝於目標 repo）。
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          repositories: ${{ inputs.repo }}

      # 目標 repo checkout（工廠 trunk = base_branch）：agent 在此工作，
      # catalog/risk-paths/templates/skills 均從此讀取（Q-P2-1：main 絕不觸碰）。
      # 用 App token 認證——GITHUB_TOKEN 只限本 repo，無法讀取目標 repo。
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.base_branch }}
          path: target
          token: ${{ steps.app-token.outputs.token }}

      - name: Install and build
        env:
          # dsh 已為 devDependency（lockfile 鎖定）；npm ci 含它，rc.8 依賴樹較大，
          # 加大 heap 避免 OOM（2026-08-20 實測）
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npm run build

      # 標籤必須預先存在（gh issue edit --add-label 不會自動建立）。
      # 冪等：--force 在已存在時更新顏色而不報錯。
      # GH_REPO 讓 gh 指向目標 repo（預設是本 repo 的 origin）。
      - name: Ensure factory labels exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          gh label create "oversight/on-loop"  --color "1d76db" --force
          gh label create "oversight/review"   --color "d4c5f9" --force
          gh label create "oversight/in-loop"  --color "d73a4a" --force
          gh label create "needs-human"        --color "b60205" --force
          gh label create "ready"              --color "0e8a16" --force
          echo "factory labels ensured ($GH_REPO)"

      # 集中式 Issue 格式檢查（ADR-012）：檢查邏輯只存在機制 repo（dist CLI），
      # 目標 repo 不再複製 factory-issue-check.yml——每次 dispatch 在此執行一次，
      # 留言含「格式合規＋複雜度分析＋建議模型」三行（ADR-011），不合規即紅燈停派。
      # 目標 repo 的舊副本已刪除（DRIFT-ELIMINATION）；此步驟取代它。
      - name: Check issue format (central enforcement)
        env:
          # gh 在 Actions 不會自動用 GITHUB_TOKEN——需顯式傳（2026-08-19 實測）
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          mkdir -p .factory
          node dist/cli/factory-issue-check.js \
            "${{ inputs.issue_number }}" \
            --tiers config/dsh/model-tiers.yaml \
            --providers config/dsh/settings.providers.yaml \
            > .factory/issue-check.txt 2>&1 || true
          cat .factory/issue-check.txt
          gh issue comment "${{ inputs.issue_number }}" --body-file .factory/issue-check.txt
          # 不合規 → exit 1（紅燈停派；與機制 repo 自身 factory-issue-check 同語意）
          if grep -q '格式不合規' .factory/issue-check.txt; then
            echo "::error::Issue 格式不合規（factory-issue-check）——停止派工，請依留言修正後重新 dispatch"
            exit 1
          fi
          echo "格式合規"

      # DSH 的 sandbox 不會把 GH_TOKEN 傳進 agent 的 process 環境（實測：
      # step 層的 gh 可用 App token，但 agent 內的 gh 看不到任何 token）。
      # 故把短效 installation token 寫入目標 repo 的 workspace（gitignored、
      # runner 暫存、1 小時有效），由 factory-workflow skill 指示 agent 讀取。
      # 同檔也寫 base_branch 與 repo：agent 的 env 被 DSH 剝離，工作目錄
      # 又是目標 repo——這兩個值以檔案傳遞（skill 指示讀取）。
      - name: Write agent run env (token / base / repo)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p target/.factory/run
          printf '%s' "$GH_TOKEN" > target/.factory/run/gh-token
          printf '%s' "${{ inputs.base_branch }}" > target/.factory/run/base-branch
          printf '%s' "${{ inputs.repo }}" > target/.factory/run/repo
          echo "run env written: token=$(wc -c < target/.factory/run/gh-token)B base=$(cat target/.factory/run/base-branch) repo=$(cat target/.factory/run/repo)"

      # token 安全：目標 repo 未必有 .factory/ 的 gitignore 條目——若 agent 的
      # git add -A 把 .factory/run/gh-token 提交上去會外洩憑證。以 repo 本地的
      # .git/info/exclude 排除（不改動目標 repo 的檔案內容，無需 commit）。
      - name: Exclude .factory from target repo (token safety)
        run: |
          cd target
          grep -qxF '.factory/' .git/info/exclude || printf '\n.factory/\n' >> .git/info/exclude
          echo "target .git/info/exclude ignores .factory/"

      # git push 的認證（在 target/ 目標 repo checkout 內）：checkout action 把
      # `http.https://github.com/.extraheader`（AUTHORIZATION: basic GITHUB_TOKEN）
      # 寫在**獨立 credentials 檔**，經 `includeIf.gitdir:<path>/.git.path` 引入——
      # git config --unset-all 只清直接項目、清不掉 includeIf 引入的檔。故必須移除
      # includeIf 項目，再以 URL 內嵌 App token 認證（本機實測：App token 可 push）。
      - name: Configure agent git auth (target repo)
        run: |
          cd target
          git config --local --get-regexp '^includeIf\.gitdir:' 2>/dev/null | while read -r key _; do
            git config --local --unset-all "$key"
          done || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          TOKEN=$(cat .factory/run/gh-token)
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ inputs.repo }}.git"
          echo "target checkout credentials include removed; origin authenticates with app token"

      # git 身分：checkout 預設不設定 user.name/email，git commit 會失敗。
      # 以 App 的 bot 身分提交（稽核可辨識，docs/02 D6）。
      - name: Configure agent git identity (target repo)
        run: |
          cd target
          git config --local user.name "software-factory-worker[bot]"
          git config --local user.email "software-factory-worker[bot]@users.noreply.github.com"
          echo "git identity: software-factory-worker[bot]"

      # gh-stack 需要本地 base 分支（gh stack init --base $BASE_BRANCH）。
      # checkout action 對 branch ref 會建同名本地分支，但這裡明確確保：
      # 分支存在且在 HEAD；輸入錯誤的 base_branch 在此 fast fail。
      - name: Ensure base branch checked out in target
        run: |
          cd target
          git checkout -B "${{ inputs.base_branch }}" "origin/${{ inputs.base_branch }}" 2>/dev/null || \
            git checkout "${{ inputs.base_branch }}"
          echo "HEAD on: $(git rev-parse --abbrev-ref HEAD) ($(git rev-parse --short HEAD))"

      # 寫入權限探針：在花費 LLM 成本之前確認 App token 真的能 push。
      # 失敗即在此紅燈（fast fail），不進入 agent 步驟。
      # 診斷：checkout 的 extraheader 可能位於 env 層（GIT_CONFIG_* env vars，
      # 優先級高於 file config，git config --unset-all 清不掉）——故探針以
      # command-line config（-c，優先級最高）強制清空 extraheader 再 push。
      - name: Verify app token write access (target repo)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cd target
          echo "=== git env config ==="
          env | grep -i "^GIT_CONFIG" || echo "(no GIT_CONFIG env vars)"
          echo "=== extraheader origins ==="
          git config --show-origin --get-all http.https://github.com/.extraheader || echo "(none in file config)"
          echo "=== remote url (masked) ==="
          git config --get remote.origin.url | sed 's/:[^@]*@/:***@/'
          echo "=== probe push (extraheader forced empty via -c) ==="
          # 平行 run 共用同名探針分支會互相衝突（fetch first），故以 run id 唯一化
          PROBE="_factory-auth-probe-${{ github.run_id }}"
          git switch -c "$PROBE"
          git commit --allow-empty -m "auth probe"
          git -c http.https://github.com/.extraheader= push origin "$PROBE"
          git -c http.https://github.com/.extraheader= push origin --delete "$PROBE"
          git switch - 2>/dev/null || true
          echo "app token write access verified (${{ inputs.repo }})"

      # Step 2 — 初始計分（agent 啟動前，docs/06 §5.1）。
      # catalog/risk-paths 讀目標 repo（target/），不再是本 repo 根。
      - name: Initial score
        id: score
        run: |
          mkdir -p .factory/run
          node dist/cli/factory-score.js \
            --catalog target/catalog-info.yaml \
            --risk-paths target/.github/factory/risk-paths.yml \
            > .factory/score.json
          cat .factory/score.json

      # in-loop → 貼標籤 + 留言，並以 exit 1 阻斷後續 agent 步驟
      - name: Apply score labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          node dist/cli/apply-score-labels.js \
            "${{ inputs.issue_number }}" .factory/score.json

      # 被擋下（in-loop）時說明並結束；agent 步驟會被 if: success() 跳過
      - name: Stop when in-loop
        if: failure()
        run: |
          echo "blocked-in-loop; agent 未啟動（docs/06 §4.3）"

      # Step 2.5 — 模型 tier 選擇（docs/ADR/011, docs/04 §7）。
      # 以「Issue 需求分析（零 LLM 成本）＋初始計分」決定 model chain；agent 步驟
      # 沿 chain 依序嘗試（provider 層失敗 fallback）。dry_run 也執行以驗證接線。
      - name: Select model tier
        id: model
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          mkdir -p .factory
          gh issue view "${{ inputs.issue_number }}" --json body > .factory/issue.json
          node dist/cli/factory-model.js \
            --issue .factory/issue.json \
            --score .factory/score.json \
            --tiers config/dsh/model-tiers.yaml \
            --providers config/dsh/settings.providers.yaml \
            --tier "${{ inputs.model_tier }}" \
            --provider "${{ inputs.model_provider }}" \
            > .factory/model.json
          cat .factory/model.json
          echo "model tier selected: $(jq -r .tier .factory/model.json) ($(jq -r .complexitySource .factory/model.json))"

      # Step 3 — 執行 agent（DSH headless，受限沙箱；或 dry-run stub）。
      # agent 的工作目錄 = target/（目標 repo）；機制（node_modules/dist/config）
      # 在根目錄以絕對路徑引用。
      - name: Install gh stack extension
        if: inputs.dry_run != true
        env:
          # 認證安裝：未認證的 gh extension install 會打爆 GitHub API rate limit
          #（2026-08-18 實測：4 個平行 run 觸發 403）。冪等：已安裝則跳過。
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          if gh extension list | grep -q "github/gh-stack"; then
            echo "gh-stack already installed"
          else
            gh extension install github/gh-stack --pin v0.1.0
          fi
          gh stack --version

      - name: Run factory agent
        id: agent
        if: success()
        timeout-minutes: 50      # step 級逾時（Java/mvn 建置需較長時間；2026-08-21 25min 不夠）
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # 多 provider 金鑰：全部以 env 傳入（DSH 在 sandbox 外讀取），
          # 由 model_provider 選擇使用哪一個；未設定的會 MISSING_CREDENTIAL。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          TASK_TYPE: ${{ inputs.task_type }}
        run: |
          set +e
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            # agent 一律在目標 repo checkout 內工作（sandbox workspaceRoot = cwd）
            cd target
            node "$GITHUB_WORKSPACE/dist/cli/dry-run-agent.js" \
              "${{ inputs.dry_run_scenario }}" "${{ inputs.issue_number }}" \
              > .factory/run/dry.txt 2>&1
            code=0
          else
            # dsh 已為 devDependency（Install and build 的 npm ci 已安裝，lockfile 鎖定）
            # 再進入目標 repo 工作目錄（其餘路徑以 $GITHUB_WORKSPACE 絕對引用）
            cd target
            mkdir -p "$HOME/.dsh"
            # 共享 skills root（ADR-012）：factory skills 單一事實來源在機制 repo，
            # 目標 repo 不再複製 .dsh/skills（DRIFT-ELIMINATION）——同步到
            # $HOME/.dsh/skills（DSH rank 400 user-dsh）供 agent 載入。
            mkdir -p "$HOME/.dsh/skills"
            cp -r "$GITHUB_WORKSPACE/.dsh/skills/." "$HOME/.dsh/skills/"
            echo "skills synced: $(ls "$HOME/.dsh/skills" | tr '\n' ' ')"
            # 模型 tier 路由（ADR-011）：chain 來自「Select model tier」步驟的
            # model.json（primary + fallback）。每項重寫 agent-default-model 後跑 dsh；
            # provider 層失敗（429/credential/UNKNOWN_MODEL）沿 chain fallback。
            while IFS= read -r ENTRY; do
              [ -z "$ENTRY" ] && continue
              P=$(printf '%s' "$ENTRY" | jq -r .provider)
              MODEL=$(printf '%s' "$ENTRY" | jq -r .model)
              EFFORT=$(printf '%s' "$ENTRY" | jq -r '.reasoningEffort // empty')
              cp "$GITHUB_WORKSPACE/config/dsh/settings.providers.yaml" "$HOME/.dsh/settings.yaml"
              {
                printf 'agent-default-model:\n  provider: %s\n  model: %s\n' \
                  "$P" "$MODEL"
                [ -n "$EFFORT" ] && printf '  reasoningEffort: %s\n' "$EFFORT"
              } >> "$HOME/.dsh/settings.yaml"
              echo "trying model routing: $P/$MODEL${EFFORT:+ (effort=$EFFORT)}"
              # 依 task_type 選模板（優先目標 repo 的模板，fallback 到機制 repo）
              # 檔名慣例為 task-template-<type>.txt（type 無 agent- 前綴，
              # docs/09 §3 2.1）；TASK_TYPE 帶 agent- 前綴，故剝除後再拼檔名。
              TEMPLATE=".github/factory/task-template-${TASK_TYPE#agent-}.txt"
              [ -f "$TEMPLATE" ] || TEMPLATE="$GITHUB_WORKSPACE/.github/factory/task-template-${TASK_TYPE#agent-}.txt"
              if [ ! -f "$TEMPLATE" ]; then
                # 4 種 task_type 應各有專屬模板（factory-assets 對抗性測試釘住）；
                # 走到這裡表示漂移（缺檔或新增 task_type 未建檔）——fail-loud：
                # 警告不可靜默，讓維護者看到降級。
                echo "::warning::No dedicated task-template for task_type=${TASK_TYPE}; falling back to generic task-template.txt"
                TEMPLATE="$GITHUB_WORKSPACE/.github/factory/task-template.txt"
              fi
              echo "task template: $TEMPLATE"
              "$GITHUB_WORKSPACE/node_modules/.bin/dsh" --profile headless \
                --patch "$GITHUB_WORKSPACE/config/dsh/factory-guardrail.patch.yml" \
                "$(sed -e "s/<ISSUE>/${{ inputs.issue_number }}/" \
                        -e "s|<REPO>|${{ inputs.repo }}|" \
                        -e "s|<BASE_BRANCH>|${{ inputs.base_branch }}|" "$TEMPLATE")" \
                > .factory/run/stdout.txt 2> .factory/run/stderr.txt
              code=$?
              echo "provider=$P exit=$code"
              if [ "$code" -eq 0 ]; then break; fi
              # 僅 provider 層失敗才 fallback（rate limit/credential/model）；
              # 任務層失敗（非上述錯誤）不重試（docs/02 §6）。
              # 含 AUTH/401/invalid_api_key：壞 key 也屬 credential 層失敗，應沿 chain
              # fallback（2026-08-28 #171 實測：qwen key 401 直接 needs-human，未 fallback）。
              if ! grep -qiE "RATE_LIMIT|429|MISSING_CREDENTIAL|UNKNOWN_MODEL|AUTH|401|INVALID_CREDENTIAL|invalid_api_key" .factory/run/stderr.txt; then
                break
              fi
            done < <(jq -c '.chain[]' "$GITHUB_WORKSPACE/.factory/model.json")
          fi
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # fallback：agent 未寫 report 時依 exit code 補最小 report（cwd=target）
          node "$GITHUB_WORKSPACE/dist/cli/write-report.js" \
            "${{ inputs.issue_number }}" "$code" \
            .factory/run/stdout.txt .factory/run/stderr.txt

      # Step 4–5 — 執行後判定：重計分 + 停手規則（重用 runWorkItem 管線）。
      # report.json 在 target/.factory/run/（agent cwd=target）；catalog/risk-paths 讀目標 repo。
      # TOKEN_BUDGET 由 input 帶入（0 = 不設限），judge 讀 env（Q02-5 SR7 接線）。
      - name: Judge terminal state
        id: judge
        if: steps.agent.outcome == 'success'
        env:
          TOKEN_BUDGET: ${{ inputs.token_budget }}
        run: |
          node dist/cli/factory-judge.js \
            target/.factory/run/report.json \
            target/catalog-info.yaml \
            target/.github/factory/risk-paths.yml \
            > .factory/judge.json
          cat .factory/judge.json

      # agent 逾時/失敗捕獲：judge 只在 success 跑，逾時會靜默（2026-08-21 實測
      # run #32491052696 逾時後無 needs-human）。此步補最小 report + 留言 + 標籤。
      - name: Handle agent timeout/failure
        if: always() && steps.agent.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          cd target
          node "$GITHUB_WORKSPACE/dist/cli/write-report.js" \
            "${{ inputs.issue_number }}" 1 \
            .factory/run/stdout.txt .factory/run/stderr.txt --timed-out || true
          gh issue comment "${{ inputs.issue_number }}" \
            --body "⏱️ factory agent 未在時限內完成（逾時或失敗）——已轉交人類接手。請查看 run ${{ github.run_id }} 的 logs。"
          gh issue edit "${{ inputs.issue_number }}" --add-label needs-human

      - name: Apply judge labels and comment
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
        run: |
          node dist/cli/apply-judge-labels.js \
            "${{ inputs.issue_number }}" .factory/judge.json

      # Step 6（人類）— 第 1 期不自動合併；留言告知等待審查
      - name: Summary
        if: always()
        run: |
          echo "run=${{ github.run_id }} repo=${{ inputs.repo }} base=${{ inputs.base_branch }} issue=${{ inputs.issue_number }} dry_run=${{ inputs.dry_run }}"
          echo "工廠執行完成。第 1 期：所有變更等待人類審查後合併。"

      # 診斷：agent 的 stdout/stderr/report 上傳成 artifact（失敗也要，否則無從查）
      - name: Upload run artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: factory-run-${{ inputs.issue_number }}
          path: |
            target/.factory/run/
            .factory/model.json
            .factory/issue.json
          if-no-files-found: ignore
