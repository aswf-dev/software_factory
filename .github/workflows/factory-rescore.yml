# 二次判定（docs/06 §5.3, Q06-5）：PR 更新時獨立重計分，攔截「說低做高」。
#
# 觸發：
#   - pull_request（本 repo 的 factory/* 分支 PR 自動觸發）
#   - workflow_dispatch（對其他 repo 的 factory/* PR 手動重計分——機制留在此 repo，
#     Q-P2-1 config-only 移植：目標 repo 不需複製任何邏輯）
#
# 判定以 factory-rescore CLI 執行（重用既有 src/scoring）；目標 repo 的
# catalog/risk-paths 從 target/（base_branch checkout）讀取；gh 以 GH_REPO
# 指向目標 repo。此 workflow 不 push 任何分支，不觸碰任何 repo 的 main。
name: Factory Rescore

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      repo:
        description: 目標 repo（owner/name）；預設本 repo
        required: false
        type: string
        default: aswf-dev/software_factory
      base_branch:
        description: 目標 repo 的工廠 trunk 分支（僅供 checkout；此 workflow 不 push）
        required: false
        type: string
        default: main
      pr_number:
        description: 要重計分的 PR 編號（workflow_dispatch 必填）
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 機制 repo（本 workflow 所在 = software_factory：CLI/dist 在此）
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # D6：以 App 身分留言/貼標籤（比照 factory-run 的 token 橋接）。
      # repositories 限定目標 repo（最小權限）；App 需已安裝於目標 repo。
      # 僅 factory/* PR 或 dispatch 需要（Dependabot 等非 factory PR 的 run 不取得
      # secrets——GitHub 對 Dependabot PR 限制 secrets，mint 必然失敗，故整組 skip）。
      # owner 需與 repositories 拆開傳：該 action 的 owner 預設為當前 repo
      # owner（aswf-dev），repositories 只收不含 owner 的名稱；跨 owner 直接
      # 傳 owner/name 會被擋（2026-09-01 實測 factory-run run 33523314113）。
      - name: Resolve target owner/name
        id: target
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'factory/') }}
        env:
          TARGET_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.repo || github.repository }}
        run: |
          set -euo pipefail
          case "$TARGET_REPO" in
            */*) ;;
            *) echo "::error::repo 必須為 owner/name 格式，實得：$TARGET_REPO"; exit 1 ;;
          esac
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint app token
        id: app-token
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'factory/') }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}

      # 目標 repo checkout（工廠 trunk = base_branch）：catalog/risk-paths 由此讀取。
      # pull_request 觸發時目標即本 repo（無害的第二份 checkout）。
      - name: Checkout target repo
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'factory/') }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.repo || github.repository }}
          ref: ${{ inputs.base_branch }}
          path: target
          token: ${{ steps.app-token.outputs.token }}

      # 二次判定。pull_request 觸發：僅 factory/* 分支（非 factory PR 無監督
      # 升級風險需攔截）；workflow_dispatch 觸發：一律執行（手動指定 PR）。
      - name: Rescore factory PR
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'factory/') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.repo || github.repository }}
        run: |
          # .factory/ 被 gitignore（fresh checkout 不存在）——redirect 前必須建目錄，
          # 否則 `> .factory/rescore.json` 直接失敗（試點 #2 實測抓到：舊 workflow 的
          # Rescore 步驟從未被 factory/* PR 真實執行過，非 factory PR 都是 skipped）。
          mkdir -p .factory
          PR_NUMBER="${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}"
          node dist/cli/factory-rescore.js \
            "$PR_NUMBER" \
            target/catalog-info.yaml target/.github/factory/risk-paths.yml \
            > .factory/rescore.json
          cat .factory/rescore.json
          node -e '
            const fs = require("fs")
            const r = JSON.parse(fs.readFileSync(".factory/rescore.json", "utf8"))
            if (r.escalated && r.issueNumber) {
              const { execFileSync } = require("child_process")
              const body = [
                "## 二次判定：監督層級升級（docs/06 §5.3 單向棘輪）",
                "",
                "PR #" + r.prNumber + " 的實際變更觸發了更高的監督層級：",
                "- 計分：" + r.total + " 分",
                "- 觸發硬性規則：" + (r.triggeredHardRules.join("、") || "（無，計分上升）"),
                "",
                "**自動合併權限已撤銷**；請人類審查此 PR 的風險。",
              ].join("\n")
              execFileSync("gh", ["issue", "comment", String(r.issueNumber), "--body", body])
              console.log("escalation comment posted to issue #" + r.issueNumber)
            } else {
              console.log("no escalation; oversight tier unchanged")
            }
          '

      - name: Skip non-factory PR
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'factory/') }}
        run: echo "非 factory 分支，跳過二次判定"
