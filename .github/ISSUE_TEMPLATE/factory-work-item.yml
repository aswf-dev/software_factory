name: Factory Work Item
description: 開立 factory 工作項（需求 PRD + 驗收標準 DoD）。欄位必填——格式不合會被 factory-issue-check 退回。
title: "[factory] <一句話需求>"
labels: ["meta/observation"]
body:
  - type: dropdown
    id: task_type
    attributes:
      label: 任務類型
      description: 決定 task-template 與 skill 分支（docs/09 §3 2.1）
      options:
        - agent-add-tests
        - agent-fix-bug
        - agent-update-deps
        - agent-write-docs
        - agent-write-spec
        - agent-analyze
        - agent-propose-skill
        - agent-pbt-audit
    validations:
      required: true
  - type: textarea
    id: requirement
    attributes:
      label: 需求描述（PRD）
      description: 做什麼、為什麼、範圍、已知問題。缺可驗證的驗收條件時，agent 會依 factory-stop-rules 停手（SR4）。
      # agent-pbt-audit：「目標模組 / 檔案：」必須恰好一個路徑（稽核範圍，ADR-019 R3）。
      placeholder: |
        目標模組 / 檔案：
        做什麼（一句話）：
        為什麼：
        範圍（不碰什麼）：
        已知問題：
        不變量：
    validations:
      required: true
  - type: checkboxes
    id: acceptance
    attributes:
      label: 驗收標準（DoD）
      description: 全部勾選才算可驗證的工作項；缺任一項會被 factory-issue-check 退回。
      options:
        - label: 有可驗證的測試/驗證方式（測試紅→綠或明確驗證命令）
          required: true
        - label: 不觸碰高風險路徑（H1–H3 等硬規則，見 risk-paths.yml）
          required: true
        - label: 跑測試確認綠燈（不跑需外部服務的 E2E）
          required: true
    validations:
      required: true
  - type: input
    id: target_repo
    attributes:
      label: 目標 repo（預設本 repo）
      description: owner/name；其他 repo 時請一併指定 base_branch
      placeholder: aswf-dev/software_factory
  # agent-write-spec 專用（ADR-018 §5、§11）。GitHub 原生表單不支援條件欄位，
  # 故一律顯示為選填；是否必填由 factory-issue-check 判定（只有 write-spec 必填）。
  # 標題與 Backstage 模板、buildIssueBody、FIELD_TITLES 逐字一致（factory-assets 釘住）。
  - type: input
    id: spec_name
    attributes:
      label: 規格名稱
      description: 僅 agent-write-spec 必填。kebab-case 小寫英數（例如 redlock），決定 specs/<name>/ 目錄。
      placeholder: redlock
  - type: input
    id: spec_source
    attributes:
      label: 規格來源
      description: 僅 agent-write-spec 必填。repo 內路徑（例如 docs/specs/redlock.md；網頁請先存檔進 repo），或填 issue（以本 Issue 的 PRD 為規格，由 CI 快照）。不接受 URL。
      placeholder: docs/specs/redlock.md
  # 規劃健檢（docs/32 §4）：本欄位只被解析、不被強制——宣告的是「順序」，不是格式。
  # 標題與 Backstage 模板、buildIssueBody、FIELD_TITLES 逐字一致（factory-assets 釘住）。
  - type: input
    id: prerequisites
    attributes:
      label: 前置工作項（可留空）
      description: 選填。若這張單必須等別的工單先完成，填它的 Issue 編號（例如 #192，多個以逗號分隔）。規劃健檢會提醒，但不阻止派工。
      placeholder: "#192"
